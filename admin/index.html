<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Agrio Art</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F2F0EB">
<script>try{if(localStorage.getItem("agrio-panel-tema")==="noche")document.documentElement.dataset.tema="noche"}catch(e){}</script>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../nube.js"></script>
<style>
/* ---------- colores de la marca: día (claro → salmón) y noche (gris oscuro → salmón) ---------- */
:root{--ink:#1C1C1D;--sub:#4A4946;--linea:rgba(28,28,29,.13);--base:#F2F0EB;--salmon:#E68AA1;--rosa:#C6647E;--rosa2:#E68AA1;
  --vidrio:rgba(251,250,247,.56);--vidrioB:rgba(255,255,255,.7);--sombra:0 18px 40px -28px rgba(90,40,55,.55);--celda:rgba(28,28,29,.07);--celda2:rgba(28,28,29,.12);--pieza:rgba(255,255,255,.6);--pieza2:rgba(255,255,255,.9);--entrada:rgba(255,255,255,.72);--bordeE:rgba(28,28,29,.2);
  --fuerte:#1C1C1D;--enFuerte:#FBFAF7;--ventana:rgba(246,243,238,.88);--solido:#FBFAF7;--nav:#1C1C1D;--navB:rgba(255,255,255,.06);
  --rojoF:#FBD9DB;--rojo:#B3152A;--verdeF:#CFEEDA;--verde:#12663A;--sw:rgba(28,28,29,.3);
  --esF:#FFEBC2;--es:#774C04;--prF:#D8E6FB;--pr:#1B4A92;--fiF:#CFEEDA;--fi:#12663A;
  --r:22px;--rb:13px;--g:14px;--cond:"Fira Sans Extra Condensed",sans-serif;--txt:"Instrument Sans",sans-serif;color-scheme:light}
:root[data-tema="noche"]{--ink:#F5F2EB;--sub:#CFCAC2;--linea:rgba(255,255,255,.14);--base:#1C1C1D;--salmon:#C6647E;
  --vidrio:rgba(30,30,32,.58);--vidrioB:rgba(255,255,255,.12);--sombra:0 20px 44px -26px rgba(0,0,0,.8);--celda:rgba(255,255,255,.09);--celda2:rgba(255,255,255,.16);--pieza:rgba(255,255,255,.09);--pieza2:rgba(255,255,255,.15);--entrada:rgba(0,0,0,.28);--bordeE:rgba(255,255,255,.24);
  --fuerte:#F5F2EB;--enFuerte:#1C1C1D;--ventana:rgba(34,34,36,.9);--solido:#3A3A3D;--nav:#111112;--navB:rgba(255,255,255,.1);--rosa:#F0A3B6;--sw:rgba(255,255,255,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--base)}
body{font:400 14px/1.45 var(--txt);color:var(--ink)}
body::before{content:"";position:fixed;inset:-1px;z-index:-1;background:radial-gradient(110% 95% at 100% 100% in oklab,var(--salmon) 0%,transparent 74%),radial-gradient(70% 60% at 0% 104% in oklab,color-mix(in oklab,var(--salmon) 55%,transparent) 0%,transparent 78%),var(--base)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
:is(button,a,select,[tabindex]):focus-visible{outline:3px solid var(--rosa);outline-offset:2px}
:is(.lateral,.movil) button:focus-visible{outline-color:var(--rosa2)}
/* vidrio: desenfoca el fondo detrás de cada sección */
.vidrio,.carta,.bloque,.col,.tarjeta{background:var(--vidrio);border:1px solid var(--vidrioB);box-shadow:var(--sombra);-webkit-backdrop-filter:blur(26px) saturate(1.25);backdrop-filter:blur(26px) saturate(1.25)}
/* ---------- botones: rectángulo de borde redondo, icono + texto ---------- */
.boton{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:var(--rb);background:var(--celda);color:var(--ink);font:600 14px/1 var(--txt);white-space:nowrap;text-decoration:none;cursor:pointer;transition:background .15s,filter .15s}
.boton:hover{background:var(--celda2)}
.boton.verde{background:var(--verdeF);color:var(--verde)}
.boton.rojo{background:var(--rojoF);color:var(--rojo)}
.boton:is(.verde,.rojo):hover{filter:brightness(.95)}
.boton.ancho{width:100%}
.boton.chico{min-height:40px;padding:0 13px;font-size:13px;gap:7px}
.boton.chico svg.i{width:16px;height:16px}
.boton:disabled,.boton[aria-disabled="true"]{opacity:.45;cursor:default;pointer-events:none}
.ic{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:var(--rb);background:var(--celda)}
.seg{display:flex;gap:2px;padding:3px;border-radius:var(--rb);background:var(--celda)}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 13px;border:0;border-radius:10px;background:none;font-weight:600;font-size:13px;color:var(--sub);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button:is([aria-pressed="true"],[aria-selected="true"]){background:var(--fuerte);color:var(--enFuerte)}
.seg svg.i{width:16px;height:16px}
/* ---------- entrada ---------- */
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.tarjeta{width:min(420px,100%);border-radius:26px;padding:32px 28px 26px}
.marca{font:900 32px/.9 var(--cond);text-transform:uppercase}
.marca span{color:var(--rosa)}
.tarjeta .s{margin:8px 0 20px;color:var(--sub)}
.tarjeta .seg{margin-bottom:18px}
.tarjeta .seg button{flex:1;padding:0 6px}
.campo{display:block;margin-bottom:13px}
.linSw{display:flex!important;align-items:center;gap:10px;min-height:44px;margin:0!important;font:600 14px/1 var(--txt)!important;color:var(--ink)!important}
.campo>span{display:block;margin-bottom:6px;font:600 12px/1.3 var(--txt);color:var(--sub)}
.entrada{width:100%;padding:11px 13px;border:1px solid var(--bordeE);border-radius:12px;background:var(--entrada);font-size:16px;outline:none}
.entrada:focus{border-color:var(--rosa);box-shadow:0 0 0 1px var(--rosa)}
textarea.entrada{min-height:84px;resize:vertical}
.nota{margin:12px 0 0;font-size:12px;color:var(--sub);text-align:center}
.demo{margin:0 0 var(--g);padding:10px 14px;border-radius:var(--rb);background:var(--esF);font-size:12.5px;color:var(--es)}
/* ---------- menú lateral (negro, se despliega y se retrae) ---------- */
.app{display:flex;min-height:100vh}
.hueco{position:relative;width:252px;flex:none;transition:width .28s cubic-bezier(.3,.8,.3,1)}
.lateral{position:sticky;top:20px;width:232px;height:calc(100vh - 40px);height:calc(100dvh - 40px);margin:20px 0 20px 20px;padding:14px 12px 12px;border-radius:26px;background:var(--nav);border:1px solid var(--navB);color:#EDEAE3;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 22px 40px -26px rgba(0,0,0,.6);transition:width .28s cubic-bezier(.3,.8,.3,1)}
.latT{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:44px;margin-bottom:14px;padding-left:8px;flex:none}
.lateral .marca,.movil .marca{font-size:25px;color:#F5F2EB;white-space:nowrap}
.lateral .marca span,.movil .marca span{color:var(--rosa2)}
.plegar{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 11px;flex:none;border:0;border-radius:var(--rb);background:#2E2E31;color:#EDEAE3;font:600 12.5px/1 var(--txt)}
.plegar:hover{background:#3B3B3F}
.plegar svg{transition:transform .28s}
#nav{display:grid;gap:4px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;flex:0 1 auto;min-height:0}
.nav{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 13px;border:0;border-radius:var(--rb);background:none;font-weight:600;color:#BDB9B1;text-align:left;white-space:nowrap}
.nav:hover{background:#2A2A2D;color:#fff}
.nav[aria-current="page"]{background:var(--rosa2);color:#1C1C1D}
.nav em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;min-width:22px;text-align:center;padding:3px 7px;border-radius:7px;background:var(--rosa2);color:#1C1C1D}
.nav[aria-current="page"] em{background:#1C1C1D;color:#fff}
.nav b,.pieS b{font-weight:inherit}
.pieS{margin-top:auto;padding-top:12px;flex:none;white-space:nowrap}
.pieS p{margin:0;padding:0 13px 8px;font-size:12px;color:#A9A7A2;overflow:hidden}
.pieS p b{display:block;color:#EDEAE3;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.min .hueco{width:112px}
.min .lateral{width:92px;padding:12px 8px}
.min .latT{padding:0;justify-content:center}
.min .lateral .marca,.min .lateral .pieS p{display:none}
.min .plegar svg{transform:rotate(180deg)}
.min .plegar,.min .lateral .nav{flex-direction:column;justify-content:center;gap:5px;width:100%;height:56px;padding:0 2px;font-size:10.5px;line-height:1;text-align:center}
.min .lateral .nav em{position:absolute;top:4px;right:12px;min-width:18px;padding:2px 4px;font-size:10px;line-height:1.2;margin:0;box-shadow:0 0 0 2px var(--nav)}
.min .lateral .nav[aria-current="page"] em{background:#1C1C1D;color:#fff;box-shadow:none}
.movil{display:none}
/* ---------- cabecera ---------- */
.contenido{flex:1;min-width:0;padding:24px 24px 40px 20px;max-width:1720px}
.cabeza{display:flex;align-items:center;justify-content:space-between;gap:16px 28px;margin-bottom:18px;flex-wrap:wrap;min-height:60px}
.cabeza h1{margin:0;font:900 52px/.86 var(--cond);text-transform:uppercase}
.cabeza p{margin:7px 0 0;color:var(--sub);max-width:46ch}
.accC{display:flex;gap:8px;flex-wrap:wrap}
.sello{padding:4px 8px;border-radius:8px;background:var(--rosa2);font:700 11px/1.2 var(--txt);color:#1C1C1D;white-space:nowrap}
.sello.n{background:var(--fuerte);color:var(--enFuerte)}
/* ---------- bento ---------- */
.bento{display:grid;gap:var(--g)}
.carta{position:relative;min-width:0;border-radius:var(--r);padding:18px;container-type:inline-size}
.cartaT{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;margin-bottom:10px}
.cartaT h2{margin:0;font:600 17px/1.15 var(--txt);letter-spacing:-.02em}
.bento.home{grid-template-columns:minmax(0,1.12fr) minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"met met met" "ilu com car" "ate ate cli"}
.b-met{grid-area:met;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--g)}
.b-ilu{grid-area:ilu}.b-com{grid-area:com}.b-car{grid-area:car}.b-ate{grid-area:ate}.b-cli{grid-area:cli}
.metrica{display:flex;align-items:center;gap:13px;padding:15px 16px;container-type:normal}
.metrica .ic{width:46px;height:46px}
.metrica b{display:block;font:700 23px/1.1 var(--txt);letter-spacing:-.035em;white-space:nowrap}
.metrica span:not(.ic,.sello){display:block;font-size:12.5px;line-height:1.3;color:var(--sub)}
.metrica .sello{display:inline-block;margin-top:5px}
/* filas de las listas previas */
.rg{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:2px 12px;width:calc(100% + 16px);margin:0 -8px;padding:10px 8px;border:0;border-radius:14px;background:none;text-align:left;transition:background .15s}
.rg{position:relative}
.rg+.rg::before{content:"";position:absolute;left:8px;right:8px;top:0;border-top:1px solid var(--linea)}
.rg:hover{background:var(--celda)}
.rg .mini{grid-row:1/4;width:52px;height:60px;border-radius:var(--rb);background:var(--celda) center 25%/cover no-repeat}
.rg .ic{grid-row:1/4;width:52px;height:60px}
.rg b{font:600 15px/1.2 var(--txt);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg .m{font-weight:700;text-align:right;white-space:nowrap}
.rg small{grid-column:2/-1;font-size:12.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg .etq{grid-column:2/-1;justify-self:start;margin-top:3px}
@container (min-width:400px){.rg small{grid-column:2}.rg .etq{grid-column:3;justify-self:end;margin:0}.rg :is(.mini,.ic){grid-row:1/3}}
.rg.cl{grid-template-columns:44px minmax(0,1fr) auto}
.rg.cl .cara{grid-area:1/1/3/2}
.rg.cl b{grid-area:1/2}
.rg.cl .m{grid-area:1/3/3/4;align-self:center}
.rg.cl small{grid-area:2/2}
.cara{width:44px;height:44px;flex:none;display:inline-grid;place-items:center;border-radius:var(--rb);background:var(--celda2);font:700 13px/1 var(--txt)}
.cara.r{background:var(--rosa2);color:#1C1C1D}
/* carrete de las más vendidas */
.b-car{display:flex;flex-direction:column}
.carrete{flex:1;display:flex;gap:10px;min-height:290px;margin:0 -18px;padding:0 18px;scroll-padding:0 18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.carrete::-webkit-scrollbar{display:none}
.cuadro{position:relative;flex:0 0 80%;scroll-snap-align:start;overflow:hidden;padding:0;border:0;border-radius:18px;background:#2A2A2B center 22%/cover no-repeat;color:#fff;text-align:left}
.cuadro:only-child{flex-basis:100%}
.cuadro::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,22,.5) 0%,rgba(20,20,22,0) 30%,rgba(20,20,22,0) 48%,rgba(20,20,22,.86) 88%)}
.cuadro>*{position:absolute;z-index:1;left:16px;right:16px}
.cuadro i{top:14px;font:900 46px/.85 var(--cond);font-style:normal;color:var(--rosa2)}
.cuadro span{bottom:15px;font-size:13px}
.cuadro span b{display:block;font:600 20px/1.15 var(--txt);letter-spacing:-.02em}
.pasos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
/* pedidos que requieren atención */
.b-ate{display:flex;flex-direction:column}
.tira{flex:1;display:flex;gap:10px;overflow-x:auto;margin:0 -18px -18px;padding:8px 18px 22px;scrollbar-width:thin;scrollbar-color:var(--sw) transparent}
.hoja{flex:1 0 190px;max-width:250px;min-height:232px;display:flex;flex-direction:column;align-items:flex-start;padding:14px;border:0;border-radius:16px;background:var(--pieza);text-align:left;transition:background .2s}
.hoja:not(.una):hover{background:var(--pieza2)}
.hoja .razon{padding:5px 9px;border-radius:8px;background:var(--esF);color:var(--es);font:700 11.5px/1.2 var(--txt)}
.hoja .razon.alta{background:var(--rojoF);color:var(--rojo)}
.hoja b{margin-top:12px;font:600 15px/1.18 var(--txt);letter-spacing:-.02em;overflow-wrap:anywhere}
.hoja .detalle{margin-top:5px;font-size:12.5px;line-height:1.35;color:var(--sub)}
.hoja .monto{margin-top:auto;padding-top:12px;font:700 17px/1 var(--txt);letter-spacing:-.03em}
.hoja small{margin-top:5px;font-size:11.5px;color:var(--sub)}
.hoja.una{flex:2 0 250px;max-width:400px;background:var(--rosa2);color:#1C1C1D;rotate:-1.4deg}
.hoja.una :is(.detalle,small){color:#33191F}
.hoja.una b{font-size:20px}
.hoja.una .monto{font-size:36px;letter-spacing:-.05em}
/* ---------- listas ---------- */
.bloque{border-radius:var(--r);overflow:hidden;margin-bottom:var(--g)}
.vacio{padding:22px 18px;color:var(--sub)}
.filtros{display:flex;align-items:flex-end;gap:10px 14px;margin-bottom:var(--g);flex-wrap:wrap}
.grupoF>span{display:block;margin:0 0 5px 4px;font:600 12px/1.2 var(--txt);color:var(--sub)}
.filtros .seg{min-height:46px;background:var(--pieza);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.buscar{display:flex;align-items:center;gap:9px;flex:0 1 320px;min-width:170px;height:46px;padding:0 14px;border-radius:var(--rb);background:var(--pieza);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--sub)}
.buscar input{flex:1;min-width:0;height:100%;border:0;padding:0;background:none;outline:none;font-size:14px;color:var(--ink)}
.buscar input::placeholder{color:var(--sub);opacity:1}
.buscar:focus-within{box-shadow:0 0 0 2px var(--rosa)}
.filtros.p .buscar{flex:1 1 190px;max-width:360px}
.filtros .fin{margin-left:auto}
.fila{position:relative;display:grid;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--linea)}
.fila:first-child{border-top:0}
.fila.click{cursor:pointer}
.fila.click:hover,.fila.click.elegida,.fila.tarea:hover{background:var(--celda)}
.titulos{font-size:12px;color:var(--sub)}
.fp{grid-template-columns:16px 40px minmax(140px,1.4fr) 110px 132px 196px}
.fc{grid-template-columns:44px minmax(130px,1.3fr) minmax(0,1.3fr) 64px 116px}
.nombre b{display:block;font:600 15px/1.2 var(--txt);letter-spacing:-.01em;overflow-wrap:anywhere}
.nombre span{display:block;margin-top:2px;font-size:12.5px;color:var(--sub)}
.peq{font-size:12.5px;color:var(--sub);overflow-wrap:anywhere}
.precio{font-weight:700}
.sw{position:relative;width:44px;height:26px;border:0;border-radius:99px;background:var(--sw);flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw[aria-checked="true"]{background:#2A7548}
.sw[aria-checked="true"]::after{left:21px}
.sw.agot[aria-checked="true"]{background:#C02B3A}
.etq{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;font-size:11.5px;line-height:1.2;font-weight:700;white-space:nowrap}
.etq::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.etq.espera{background:var(--esF);color:var(--es)}
.etq.proceso{background:var(--prF);color:var(--pr)}
.etq.finalizado{background:var(--fiF);color:var(--fi)}
.pago{font-size:11.5px;font-weight:700;color:var(--sub)}.pago.si{color:var(--verde)}
:root[data-tema="noche"] .pago.si{color:#8FD6A3}
/* ---------- pedidos como tareas ---------- */
.tablero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--g);align-items:stretch}
.tablero.solo{grid-template-columns:repeat(3,auto)}
.tablero.solo .col.abierta{min-width:0}
.tablero.solo .col:not(.abierta){width:150px}
.tablero.solo[data-solo="espera"]{grid-template-columns:minmax(0,1fr) 150px 150px}
.tablero.solo[data-solo="proceso"]{grid-template-columns:150px minmax(0,1fr) 150px}
.tablero.solo[data-solo="finalizado"]{grid-template-columns:150px 150px minmax(0,1fr)}
.tablero.solo .col.abierta .tareas{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));align-content:start}
.col{border-radius:var(--r);padding:16px 12px 12px;min-height:340px;transition:box-shadow .15s}
.col h3,.grupoL h3{margin:0 6px 14px;font:600 16px/1.2 var(--txt);letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grupoL h3{margin:0;padding:14px 18px}
:is(.col,.grupoL) h3 span{min-width:30px;padding:6px 9px;border-radius:9px;background:var(--fuerte);color:var(--enFuerte);font-size:12px;line-height:1.1;text-align:center}
.grupoL .fila{border-top:1px solid var(--linea)!important}
.tareas{display:grid;gap:8px}
.col .peq.nada{margin:6px}
.tarea{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.tarjetaP{padding:13px 14px;border-radius:16px;background:var(--pieza);transition:background .15s}
.tarjetaP:hover{background:var(--pieza2)}
.tarjetaP .arr{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-bottom:8px;font-size:12px;color:var(--sub)}
.tarjetaP .arr>span:not(.etq){flex:1 0 auto}
.grip{flex:none;width:16px!important;height:16px!important;opacity:.6}
.abre{display:block;padding:0;border:0;background:none;text-align:left;font:600 15px/1.2 var(--txt);letter-spacing:-.01em;overflow-wrap:anywhere;cursor:inherit}
.abre::after{content:"";position:absolute;inset:0;border-radius:16px}
.abre:focus-visible{outline:0}.abre:focus-visible::after{outline:3px solid var(--rosa);outline-offset:2px}
.tarjetaP .peq{display:block;margin-top:2px}

      <label class="campo"><span>Nombre</span><input class="entrada" name="nombre_es" value="${esc(t.nombre_es)}"></label>
      <label class="campo"><span>Descripción</span><textarea class="entrada" name="descripcion_es" maxlength="180">${esc(t.descripcion_es)}</textarea></label>
      <label class="campo"><span>Incluye (1)</span><input class="entrada" name="punto1_es" value="${esc(t.punto1_es)}"></label>
      <label class="campo"><span>Incluye (2)</span><input class="entrada" name="punto2_es" value="${esc(t.punto2_es)}"></label>
      <label class="campo"><span>Precio desde (COP)</span><input class="entrada" name="precio" inputmode="numeric" value="${t.precio ?? ""}"></label>
      ${web ? `<div class="campo"><span>Marcar como "El más pedido"</span><button type="button" class="sw" role="switch" aria-checked="${!!t.destacado}" aria-label="Marcar como El más pedido" id="eDest"></button></div>` : '<p class="peq">Se puede usar en los pedidos del panel. La hoja de la web sigue mostrando los tres primeros tipos.</p>'}
    </div>
    <div class="botones">${n && !web ? `<button class="boton rojo" type="button" data-borrar>${ico("basura")}Borrar</button>` : ""}<button class="boton verde" type="button" data-guardar>${ico("check")}Guardar</button></div>`,
  async ed => {
    const de = ed.querySelector("#eDest"), dest = !!de && de.getAttribute("aria-checked") === "true", fila = {...t, precio:num(ed, "precio") || 0, destacado:dest};
    ["nombre", "descripcion", "punto1", "punto2"].forEach(k => { fila[k + "_es"] = val(ed, k + "_es"); });   // el texto en inglés queda como estaba
    if (!fila.nombre_es){ avisar("Escribe el nombre."); return; }
    if (dest) for (const o of T) if (o.n !== t.n && o.destacado) await db.guardar("comision_tipos", {...o, destacado:false});
    await db.guardar("comision_tipos", fila); avisar("Comisión guardada"); cerrarEditor(); refrescar();
  },
  ed => {
    const v = ed.querySelector("#eDest"); if (v) v.onclick = () => v.setAttribute("aria-checked", String(v.getAttribute("aria-checked") !== "true"));
    const b = ed.querySelector("[data-borrar]"); if (b) b.onclick = async () => { if (!confirm(`¿Borrar "${t.nombre_es}"? Los pedidos que la usan se conservan, sin tipo. No se puede deshacer.`)) return; await db.borrar("comision_tipos", n); avisar("Comisión borrada"); cerrarEditor(); refrescar(); };
  });
}

/* AJUSTES */
VISTAS.ajustes = async c => {
  c.innerHTML = cab("Ajustes", "Conexión con la web y respaldo.") + `
    <div class="bento ajustes">
      <section class="carta a1"><span class="ic">${ico("nube")}</span><h2>Conexión</h2><p>${DEMO ? "<b>Modo demostración.</b> No hay base de datos conectada: todo se guarda solo en este navegador. Para conectarla, hay que crear el proyecto en Supabase (la guía está en la carpeta del proyecto) y poner su dirección y su clave pública en <i>nube.js</i>." : "<b>Conectado a la base de datos.</b> Los cambios se ven en la web al guardar."}</p></section>
      <section class="carta"><span class="ic">${ico("ojo")}</span><h2>Ver la web</h2><p class="peq">${DEMO ? "Se abre con los cambios de esta demostración." : "Se abre en otra pestaña."}</p><a class="boton" href="../${DEMO ? "?vista=panel" : ""}" target="_blank" rel="noopener">${ico("sale")}Abrir la web</a></section>
      <section class="carta"><span class="ic">${ico("bajar")}</span><h2>Respaldo</h2><p class="peq">Un archivo con todos los pedidos, clientes, obras y comisiones.</p><button class="boton" type="button" id="aRes">${ico("bajar")}Descargar respaldo</button></section>
      ${DEMO ? `<section class="carta" style="grid-column:1/-1;min-height:0"><h2>Datos de ejemplo</h2><p class="peq">Borra los cambios de la demostración y vuelve al inicio.</p><button class="boton rojo" type="button" id="aRst">${ico("vuelve")}Volver a los datos de ejemplo</button></section>` : ""}</div>`;
  c.querySelector("#aRes").onclick = async () => { const d = {}; for (const t of Object.keys(TABLAS)) d[t] = await db.lista(t); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], {type:"application/json"})); a.download = `respaldo-agrio-${new Date().toISOString().slice(0, 10)}.json`; a.click(); };
  const r = c.querySelector("#aRst"); if (r) r.onclick = () => { if (!confirm("Se borran los cambios de la demostración y vuelven los datos de ejemplo.")) return; localStorage.removeItem(LS); ir("ajustes"); avisar("Listo"); };
};

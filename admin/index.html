<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Agrio Art</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../nube.js"></script>
<style>
:root{--ink:#1C1C1D;--papel:#F2EEE5;--blanco:#FBFAF7;--sub:#66666b;--linea:rgba(28,28,29,.12);--rosa:#C6647E;--rosa2:#E68AA1;--ok:#2A7548;--mal:#C02B3A;--cond:"Fira Sans Extra Condensed",sans-serif;--txt:"Instrument Sans",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font:400 14px/1.45 var(--txt);color:var(--ink);background:var(--papel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
/* ---------- entrada ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#2e2e31,#141416 70%)}
.tarjeta{width:min(420px,100%);background:var(--papel);border-radius:22px;padding:32px 28px 26px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.marca{font:900 32px/.9 var(--cond);text-transform:uppercase}
.marca span{color:var(--rosa)}
.tarjeta .s{margin:8px 0 20px;color:var(--sub)}
.pestanas{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:99px;background:rgba(28,28,29,.07);margin-bottom:18px}
.pestanas button{padding:9px 6px;border:0;border-radius:99px;background:none;font-weight:600;font-size:13px;color:var(--sub)}
.pestanas button[aria-selected="true"]{background:var(--ink);color:var(--papel)}
.campo{display:block;margin-bottom:13px}
.linSw{display:flex!important;align-items:center;gap:10px;min-height:44px;margin:0!important;font:600 14px/1 var(--txt)!important;letter-spacing:0!important;text-transform:none!important;color:var(--ink)!important}
.campo>span{display:block;margin-bottom:6px;font:600 11px/1.3 var(--txt);letter-spacing:.07em;text-transform:uppercase;color:#55565a}
.entrada{width:100%;padding:11px 13px;border:1px solid rgba(28,28,29,.2);border-radius:11px;background:var(--blanco);font-size:15px;outline:none}
.entrada:focus{border-color:var(--rosa);box-shadow:0 0 0 1px var(--rosa)}
textarea.entrada{min-height:84px;resize:vertical}
.boton{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border:0;border-radius:99px;background:var(--ok);color:#fff;font:900 16px/1 var(--cond);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;transition:filter .15s}
.boton:hover{filter:brightness(1.1)}
.boton.linea{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.boton.peligro{background:var(--mal)}
.boton:focus-visible,.nav:focus-visible,.chip:focus-visible,.icono:focus-visible,.sw:focus-visible,.x:focus-visible,.menuB:focus-visible{outline:3px solid var(--rosa2);outline-offset:2px}
.boton.ancho{width:100%}
.boton:disabled{opacity:.5;cursor:default}
.nota{margin:12px 0 0;font-size:12px;color:var(--sub);text-align:center}
.demo{margin:0 0 16px;padding:10px 12px;border-radius:12px;background:#FFF4DC;border:1px solid #F0D79C;font-size:12.5px;color:#6b5420}
/* ---------- panel ---------- */
.app{display:flex;min-height:100vh}
.lateral{position:sticky;top:20px;height:calc(100vh - 40px);width:232px;flex:none;margin:20px 0 20px 20px;background:var(--blanco);border:1.5px solid var(--ink);border-radius:26px;box-shadow:0 18px 34px -26px rgba(0,0,0,.45);padding:22px 14px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.lateral .marca{font-size:28px;margin:0 10px 20px}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border:1.5px solid transparent;border-radius:15px;background:none;font-weight:600;color:#55565a;text-align:left}
.nav:hover{border-color:rgba(28,28,29,.18)}
.nav[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:#fff}
.nav svg{width:18px;height:18px;flex:none}
.nav em{margin-left:auto;font-style:normal;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--rosa);color:#fff}
.pieS{margin-top:auto;padding:12px 13px;border:1.5px solid var(--linea);border-radius:15px;font-size:12px;color:var(--sub)}
.pieS b{display:block;color:var(--ink);font-size:13px;word-break:break-all}
.pieS button{margin-top:6px;padding:0;border:0;background:none;color:#A9425E;font-weight:600;font-size:12.5px;text-decoration:underline}
.movil{display:none}
.contenido{flex:1;min-width:0;padding:26px 32px 60px}
.cabeza{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.cabeza h1{margin:0;font:900 48px/.86 var(--cond);text-transform:uppercase}
.cabeza p{margin:6px 0 0;color:var(--sub)}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.cifra{background:var(--blanco);border:1px solid var(--linea);border-radius:16px;padding:14px 16px}
.cifra span{display:block;font:600 11px/1.3 var(--txt);letter-spacing:.07em;text-transform:uppercase;color:var(--sub)}
.cifra b{display:block;margin-top:6px;font:900 32px/1 var(--cond)}
.cifra small{font-size:12px;color:var(--sub)}
.bloque{background:var(--blanco);border:1px solid var(--linea);border-radius:18px;overflow:hidden;margin-bottom:18px}
.bloque h2{margin:0;padding:14px 18px;font:900 22px/1 var(--cond);text-transform:uppercase;border-bottom:1px solid var(--linea)}
.vacio{padding:22px 18px;color:var(--sub)}
.filtros{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:7px 13px;border:1px solid rgba(28,28,29,.2);border-radius:99px;background:transparent;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--papel)}
.chip b{font-weight:700;opacity:.6;margin-left:4px}
.buscar{margin-left:auto;width:min(280px,100%);padding:8px 14px;border:1px solid rgba(28,28,29,.18);border-radius:99px;background:var(--blanco);outline:none}
.fila{display:grid;align-items:center;gap:14px;padding:11px 18px;border-top:1px solid var(--linea)}
.fila:first-child{border-top:0}
.fila.click{cursor:pointer}
.fila.click:hover{background:#F7F4EE}
.titulos{background:#F6F3EC;font:600 11px/1.3 var(--txt);letter-spacing:.07em;text-transform:uppercase;color:var(--sub)}
.fo{grid-template-columns:56px minmax(170px,1.8fr) 110px 150px 150px 92px}
.fp{grid-template-columns:44px minmax(140px,1.4fr) 96px 100px 196px 150px}
.fc{grid-template-columns:minmax(150px,1.3fr) 1.3fr 120px 80px 110px}
.mini{width:56px;height:70px;border-radius:8px;background:#ddd center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.nombre b{display:block;font:900 20px/1 var(--cond);text-transform:uppercase}
.nombre span{display:block;margin-top:3px;font-size:12.5px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.peq{font-size:12.5px;color:var(--sub)}
.precio{font-weight:700}
.sw{position:relative;width:40px;height:23px;border:0;border-radius:99px;background:#cfccc5;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{left:20px}
.sw.agot[aria-checked="true"]{background:var(--mal)}
.estadoObra{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.acc{display:flex;gap:6px;justify-content:flex-end}
.icono{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;border:1px solid rgba(28,28,29,.15);background:none}
.icono svg{width:15px;height:15px}
.etq{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.etq::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.etq.espera{background:#FFF0CF;color:#805408}
.etq.proceso{background:#DDE9FA;color:#1F4E96}
.etq.finalizado{background:#D9EFE1;color:#1F6340}
.pago{font-size:11.5px;font-weight:700;color:var(--sub)}.pago.si{color:#1F6340}
.tipo{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.tablero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{background:#ece8df;border-radius:16px;padding:10px;min-height:120px}
.col h3{margin:4px 6px 10px;font:900 18px/1 var(--cond);text-transform:uppercase;display:flex;justify-content:space-between}
.tarjetaP{display:block;width:100%;margin-bottom:8px;padding:11px 12px;border:1px solid var(--linea);border-radius:12px;background:var(--blanco);text-align:left}
.tarjetaP:hover{border-color:rgba(28,28,29,.35)}
.tarjetaP b{display:block;font-size:14px}
.tarjetaP .peq{display:block;margin-top:2px}
.tarjetaP .pie{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
/* panel lateral de edición */
.capa{position:fixed;inset:0;background:rgba(20,20,22,.38);z-index:20}
.editor{position:fixed;top:0;right:0;bottom:0;z-index:21;width:min(500px,100%);background:var(--papel);box-shadow:-30px 0 60px -20px rgba(0,0,0,.35);display:flex;flex-direction:column}
.editor .top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 22px 12px}
.editor h2{margin:0;font:900 30px/.92 var(--cond);text-transform:uppercase}
.editor .cuerpo{flex:1;overflow:auto;padding:4px 22px 20px}
.editor .botones{display:flex;gap:10px;padding:14px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--linea);background:var(--papel)}
.editor .botones .boton:last-child{flex:1}
.x{width:36px;height:36px;border:0;border-radius:50%;background:rgba(28,28,29,.08);font-size:16px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.idioma{display:inline-flex;gap:2px;padding:3px;border-radius:99px;background:rgba(28,28,29,.07);margin:2px 0 12px}
.idioma button{padding:5px 12px;border:0;border-radius:99px;background:none;font-size:12px;font-weight:600;color:var(--sub)}
.idioma button[aria-pressed="true"]{background:var(--blanco);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.foto{display:grid;grid-template-columns:140px 1fr;gap:14px;margin-bottom:14px}
.foto .img{position:relative;height:176px;border-radius:12px;background:#ddd center/contain no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.foto .lado{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--sub)}
.historia{margin:6px 0 0;padding:0;list-style:none;border-left:2px solid var(--linea)}
.historia li{position:relative;padding:0 0 10px 14px;font-size:12.5px}
.historia li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--rosa2)}
.historia time{display:block;color:var(--sub);font-size:11.5px}
.contacto{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.contacto a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid rgba(28,28,29,.2);border-radius:99px;color:inherit;text-decoration:none;font-weight:600;font-size:12.5px}
.ctipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.ctipo{background:var(--blanco);border:1px solid var(--linea);border-radius:18px;padding:16px}
.ctipo h3{margin:0 0 4px;font:900 24px/1 var(--cond);text-transform:uppercase}
.aviso{position:fixed;left:50%;bottom:24px;z-index:40;translate:-50% 0;padding:11px 18px;border-radius:99px;background:var(--ink);color:#fff;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);transition:opacity .25s,translate .25s}
.aviso[hidden]{display:block!important;opacity:0;translate:-50% 20px;pointer-events:none}
@media (max-width:820px){
  .lateral{display:none}
  .app{display:block}
  .movil{position:sticky;top:10px;z-index:12;display:block;margin:10px 12px 0}
  .movilB{display:flex;align-items:center;gap:10px;padding:9px 9px 9px 16px;border:1.5px solid var(--ink);border-radius:20px;background:var(--blanco)}
  .movilB .marca{font-size:22px}
  .movilB .donde{margin-left:auto;font-weight:600;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .menuB{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 15px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:600;font-size:14px}
  .menuB svg{width:18px;height:18px}
  .menuM{margin-top:8px;padding:10px;border:1.5px solid var(--ink);border-radius:20px;background:var(--blanco);box-shadow:0 24px 40px -20px rgba(0,0,0,.5);max-height:calc(100dvh - 90px);overflow:auto}
  .menuM .nav{padding:13px;font-size:15px}
  .menuM .pieS{margin-top:8px}
  .contenido{padding:20px 14px 60px}
  .cabeza h1{font-size:38px}
  .titulos{display:none}
  .fp,.fc{grid-template-columns:1fr auto;gap:6px 12px}
  .fo{grid-template-columns:56px 1fr auto;gap:8px 12px}
  .fo .mini{grid-row:span 3}
  .fo .estadoObra{grid-column:2 / -1}
  .fp>.peq.ocultaCel{display:none}
  .tablero{grid-template-columns:1fr}
  .foto{grid-template-columns:110px 1fr}
  .buscar{margin-left:0;width:100%}
}
</style></head>
<body>
<!-- entrada -->
<section class="login" id="vLogin" hidden>
  <form class="tarjeta" id="fLogin" novalidate>
    <div class="marca">Agrio <span>Art</span> · Panel</div>
    <p class="s">Entra para gestionar la galería, las comisiones y los pedidos.</p>
    <p class="demo" id="avisoDemo" hidden>Modo demostración: aún no hay base de datos conectada. Los cambios se guardan solo en este navegador. Entra con cualquier correo y el código <b>123456</b>.</p>
    <div class="pestanas" role="tablist"><button type="button" role="tab" aria-selected="true" data-modo="codigo">Código al correo</button><button type="button" role="tab" aria-selected="false" data-modo="clave">Usuario y contraseña</button></div>
    <label class="campo"><span>Correo</span><input class="entrada" id="lCorreo" type="email" autocomplete="email" required></label>
    <label class="campo" id="lClaveC" hidden><span>Contraseña</span><input class="entrada" id="lClave" type="password" autocomplete="current-password"></label>
    <label class="campo" id="lCodigoC" hidden><span>Código</span><input class="entrada" id="lCodigo" inputmode="numeric" autocomplete="one-time-code" maxlength="10" pattern="[0-9]*"></label>
    <button class="boton ancho" id="lBoton">Enviarme el código</button>
    <p class="nota" id="lNota"></p>
  </form>
</section>

<!-- panel -->
<div class="app" id="vApp" hidden>
  <aside class="lateral">
    <div class="marca">Agrio <span>Art</span></div>
    <nav id="nav" aria-label="Módulos" style="display:grid;gap:4px"></nav>
    <div class="pieS"><span data-modo-txt></span><b data-quien></b><button type="button" data-salir>Cerrar sesión</button></div>
  </aside>
  <header class="movil"><div class="movilB"><div class="marca">Agrio <span>Art</span></div><span class="donde" id="donde"></span><button class="menuB" type="button" id="menuB" aria-expanded="false" aria-controls="menuM"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menú</button></div>
    <div class="menuM" id="menuM" hidden><nav id="navM" aria-label="Módulos"></nav><div class="pieS"><span data-modo-txt></span><b data-quien></b><button type="button" data-salir>Cerrar sesión</button></div></div></header>
  <main class="contenido" id="contenido"></main>
</div>
<div class="capa" id="capa" hidden></div>
<aside class="editor" id="editor" hidden role="dialog" aria-modal="true" aria-labelledby="edT"></aside>
<div class="aviso" id="aviso" hidden role="status"></div>

<script type="module">
/* ============================================================
   Panel de gestión de Agrio Art.
   Con window.AGRIO_NUBE (url y clave de Supabase) trabaja con la base de datos real;
   sin ella, en modo demostración: guarda en este navegador.
   ============================================================ */
const NUBE = window.AGRIO_NUBE || {}, DEMO = !(NUBE.url && NUBE.clave);
const $ = s => document.querySelector(s), esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pesos = n => n == null || n === "" ? "—" : "$" + Math.round(+n).toLocaleString("es-CO").replace(/,/g, ".");
const fecha = d => d ? new Date(d).toLocaleDateString("es-CO", {day:"numeric", month:"short", year:"numeric"}) : "—";
const fechaHora = d => d ? new Date(d).toLocaleString("es-CO", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "";
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
function avisar(t){ const a = $("#aviso"); a.textContent = t; a.hidden = false; clearTimeout(avisar.t); avisar.t = setTimeout(() => { a.hidden = true; }, 2600); }

/* ---------- estados de los pedidos ---------- */
const ESTADOS = [["espera", "En espera por confirmar"], ["proceso", "En proceso"], ["finalizado", "Finalizado"]];
const est = e => ESTADOS.find(x => x[0] === e) || ESTADOS[0];
const etq = e => `<span class="etq ${est(e)[0]}">${est(e)[1]}</span>`;
const FORMATOS = {dig:"Digital", imp:"Impreso", enm:"Enmarcado"};

/* ---------- datos: base real (Supabase) o demostración (este navegador) ---------- */
const TABLAS = {obras:"id", comision_tipos:"n", clientes:"id", pedidos:"id", pedido_eventos:"id"};
let sb = null;
const LS = "agrio-panel-demo";
function semilla(){
  const ahora = Date.now(), dia = 864e5, c1 = uid(), c2 = uid(), c3 = uid(), p1 = uid(), p2 = uid(), p3 = uid(), p4 = uid();
  const o = (id, orden, nes, nen, des, den, precio, agotada) => ({id, orden, nombre_es:nes, nombre_en:nen, descripcion_es:des, descripcion_en:den, precio, agotada:!!agotada, imagen_url:null, visible:true});
  return {
    obras:[o("tigre", 1, "Tigre", "Tiger", "Un tigre morado con alas de insecto. Es la única obra a color.", "A purple tiger with insect wings. It's the only piece in color.", 400000),
      o("oni", 2, "Máscara oni", "Oni mask", "Un oni entre máscaras, cuentas y tinta roja.", "An oni among masks, beads and red ink.", 420000),
      o("humo", 3, "Humo blanco", "White smoke", "Una mujer de pelo blanco fuma frente a la boca de la bestia.", "A white-haired woman smokes in front of the beast's mouth.", 380000, true),
      o("katana", 4, "Katana", "Katana", "Un pequeño guerrero de capa negra, con su katana y las medias caídas.", "A small warrior in a black cape, with his katana and slouchy socks.", 350000),
      o("espinas", 5, "Espinas", "Thorns", "Entre espinas y flores, con curitas y lágrimas.", "Among thorns and flowers, with band-aids and tears.", 450000)],
    comision_tipos:[
      {n:1, nombre_es:"Primer plano", nombre_en:"Close-up", descripcion_es:"Retrato de cabeza y hombros con fondo sencillo. Ideal para un avatar, un regalo o tu propio monstruo.", descripcion_en:"Head and shoulders portrait with a simple background. Great for an avatar, a gift or your own monster.", punto1_es:"Una persona o personaje", punto1_en:"One person or character", punto2_es:"Fondo plano o con textura", punto2_en:"Plain or textured background", precio:250000, destacado:false},
      {n:2, nombre_es:"Cuerpo entero", nombre_en:"Full body", descripcion_es:"Un personaje completo, de pies a cabeza, con fondo sencillo. La forma más agria de verte dibujado.", descripcion_en:"A complete character, head to toe, with a simple background. The sourest way to get drawn.", punto1_es:"Personaje completo con su pose", punto1_en:"Full character with a pose", punto2_es:"Fondo sencillo y detalles de tu historia", punto2_en:"Simple background and details of your story", precio:420000, destacado:true},
      {n:3, nombre_es:"Mundo agrio", nombre_en:"Sour world", descripcion_es:"Uno o varios personajes dentro de un escenario completo. Una escena con todo su universo.", descripcion_en:"One or more characters inside a full scene. A picture with its whole universe.", punto1_es:"Varios personajes", punto1_en:"Several characters", punto2_es:"Escenario con ambiente y detalle", punto2_en:"Detailed setting and mood", precio:750000, destacado:false}],

  },
  ed => {
    ed.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { lang = b.dataset.l; ed.querySelectorAll("[data-l]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); ed.querySelectorAll("[data-lang]").forEach(d => { d.hidden = d.dataset.lang !== lang; }); });
    const v = ed.querySelector("#eDest"); v.onclick = () => v.setAttribute("aria-checked", String(v.getAttribute("aria-checked") !== "true"));
  });
}

VISTAS.ajustes = async c => {
  c.innerHTML = cab("Ajustes", "Conexión con la web y respaldo.") + `
    <div class="bloque"><h2>Conexión</h2><div style="padding:16px 18px">
      <p>${DEMO ? "<b>Modo demostración.</b> No hay base de datos conectada: todo se guarda solo en este navegador. Para conectarla, hay que crear el proyecto en Supabase (la guía está en la carpeta del proyecto) y poner su dirección y su clave pública en <i>nube.js</i>." : "<b>Conectado a la base de datos.</b> Los cambios se ven en la web al guardar."}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="boton linea" href="../${DEMO ? "?vista=panel" : ""}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Ver la web${DEMO ? " con estos cambios" : ""}</a><button class="boton linea" id="aRes">Descargar respaldo</button>${DEMO ? '<button class="boton peligro" id="aRst">Volver a los datos de ejemplo</button>' : ""}</div></div></div>`;
  c.querySelector("#aRes").onclick = async () => { const d = {}; for (const t of Object.keys(TABLAS)) d[t] = await db.lista(t); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], {type:"application/json"})); a.download = `respaldo-agrio-${new Date().toISOString().slice(0, 10)}.json`; a.click(); };
  const r = c.querySelector("#aRst"); if (r) r.onclick = () => { if (!confirm("Se borran los cambios de la demostración y vuelven los datos de ejemplo.")) return; localStorage.removeItem(LS); ir("ajustes"); avisar("Listo"); };
};

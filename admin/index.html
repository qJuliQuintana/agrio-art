<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Agrio Art</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../nube.js"></script>
<style>
:root{--ink:#1C1C1D;--fondo:#DAD4C8;--carta:#F5F2EB;--celda:#E4DFD4;--blanco:#FBFAF7;--papel:#F2EEE5;--sub:#5B5A56;--linea:rgba(28,28,29,.12);--rosa:#C6647E;--rosa2:#E68AA1;--ok:#2A7548;--mal:#C02B3A;--r:22px;--g:14px;--cond:"Fira Sans Extra Condensed",sans-serif;--txt:"Instrument Sans",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font:400 14px/1.45 var(--txt);color:var(--ink);background:var(--fondo)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
:is(button,a,.chip,[tabindex]):focus-visible{outline:3px solid var(--rosa);outline-offset:2px}
.negro :is(button,a):focus-visible,.lateral button:focus-visible,.movil button:focus-visible{outline-color:var(--rosa2)}
/* ---------- entrada ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#2e2e31,#141416 70%)}
.tarjeta{width:min(420px,100%);background:var(--carta);border-radius:26px;padding:32px 28px 26px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.marca{font:900 32px/.9 var(--cond);text-transform:uppercase}
.marca span{color:var(--rosa)}
.tarjeta .s{margin:8px 0 20px;color:var(--sub)}
.pestanas{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:99px;background:var(--celda);margin-bottom:18px}
.pestanas button{padding:9px 6px;border:0;border-radius:99px;background:none;font-weight:600;font-size:13px;color:var(--sub)}
.pestanas button[aria-selected="true"]{background:var(--ink);color:var(--papel)}
.campo{display:block;margin-bottom:13px}
.linSw{display:flex!important;align-items:center;gap:10px;min-height:44px;margin:0!important;font:600 14px/1 var(--txt)!important;letter-spacing:0!important;text-transform:none!important;color:var(--ink)!important}
.campo>span{display:block;margin-bottom:6px;font:600 12px/1.3 var(--txt);color:var(--sub)}
.entrada{width:100%;padding:11px 13px;border:1px solid rgba(28,28,29,.18);border-radius:12px;background:var(--blanco);font-size:16px;outline:none}
.entrada:focus{border-color:var(--rosa);box-shadow:0 0 0 1px var(--rosa)}
textarea.entrada{min-height:84px;resize:vertical}
.boton{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border:0;border-radius:99px;background:var(--ok);color:#fff;font:600 14px/1 var(--txt);white-space:nowrap;text-decoration:none;transition:filter .15s}
.boton:hover{filter:brightness(1.1)}
.boton.linea{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.boton.peligro{background:var(--mal)}
.boton.ancho{width:100%}
.boton:disabled{opacity:.5;cursor:default}
.nota{margin:12px 0 0;font-size:12px;color:var(--sub);text-align:center}
.demo{margin:0 0 var(--g);padding:10px 14px;border-radius:14px;background:#FFF4DC;border:1px solid #F0D79C;font-size:12.5px;color:#6b5420}
/* ---------- menú lateral (negro, se despliega y se retrae) ---------- */
.app{display:flex;min-height:100vh}
.hueco{position:relative;width:252px;flex:none;transition:width .28s cubic-bezier(.3,.8,.3,1)}
.lateral{position:sticky;top:20px;width:232px;height:calc(100vh - 40px);height:calc(100dvh - 40px);margin:20px 0 20px 20px;padding:16px 12px 12px;border-radius:30px;background:var(--ink);color:#EDEAE3;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 22px 40px -26px rgba(0,0,0,.6);transition:width .28s cubic-bezier(.3,.8,.3,1)}
.latT{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:16px;padding-left:10px;flex:none}
.lateral .marca,.movil .marca{font-size:28px;color:#F5F2EB;white-space:nowrap}
.lateral .marca span,.movil .marca span{color:var(--rosa2)}
.plegar{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;background:#2E2E31;color:#EDEAE3}
.plegar:hover{background:#3B3B3F}
.plegar svg{transition:transform .28s}
#nav{display:grid;gap:4px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.nav{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 13px;border:0;border-radius:23px;background:none;font-weight:600;color:#BDB9B1;text-align:left;white-space:nowrap}
.nav:hover{background:#2A2A2D;color:#fff}
.nav[aria-current="page"]{background:var(--rosa2);color:var(--ink)}
.nav em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;min-width:22px;text-align:center;padding:2px 7px;border-radius:99px;background:var(--rosa2);color:var(--ink)}
.nav[aria-current="page"] em{background:var(--ink);color:#fff}
.nav b,.pieS b{font-weight:inherit}
.pieS{margin-top:auto;padding-top:12px;flex:none;white-space:nowrap}
.pieS p{margin:0;padding:0 13px 10px;font-size:12px;color:#9D9A93;overflow:hidden}
.pieS p b{display:block;color:#EDEAE3;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.min .hueco{width:100px}
.min .lateral{width:70px}
.min .latT{padding:0;justify-content:center}
.min .lateral .marca,.min .lateral .pieS p{display:none}
.min .plegar svg{transform:rotate(180deg)}
.min .lateral .nav b{display:none}
.min .lateral .nav{justify-content:center;padding:0;width:46px}
.min .lateral .nav em{position:absolute;top:1px;right:0;min-width:18px;padding:1px 5px;font-size:10px;box-shadow:0 0 0 3px var(--ink)}
.min .lateral .nav[aria-current="page"] em{background:#fff;color:var(--ink)}
.movil{display:none}
/* ---------- cabecera ---------- */
.contenido{flex:1;min-width:0;padding:24px 24px 40px 20px;max-width:1720px}
.cabeza{display:flex;align-items:center;justify-content:space-between;gap:18px 28px;margin-bottom:20px;flex-wrap:wrap;min-height:64px}
.cabeza h1{margin:0;font:900 52px/.86 var(--cond);text-transform:uppercase}
.cabeza p{margin:7px 0 0;color:var(--sub);max-width:46ch}
.accC{display:flex;gap:8px;flex-wrap:wrap}
.datos{display:flex;gap:14px 34px;flex-wrap:wrap}
.dato{display:flex;align-items:center;gap:12px}
.dato>i{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--carta)}
.dato b{display:flex;align-items:center;gap:8px;font:700 21px/1.1 var(--txt);letter-spacing:-.03em;white-space:nowrap}
.dato span{display:block;margin-top:2px;font-size:12px;color:var(--sub)}
.sello{padding:3px 8px;border-radius:99px;background:var(--rosa2);font:700 10.5px/1.2 var(--txt);letter-spacing:0;color:var(--ink);white-space:nowrap}
.sello.n{background:var(--ink);color:#fff}
/* ---------- bento ---------- */
.bento{display:grid;gap:var(--g)}
.carta{position:relative;min-width:0;background:var(--carta);border-radius:var(--r);padding:18px}
.cartaT{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;margin-bottom:14px}
.cartaT h2{margin:0;font:600 17px/1.15 var(--txt);letter-spacing:-.02em}
.cartaT div{display:flex;gap:6px}
.redondo{width:40px;height:40px;flex:none;display:grid;place-items:center;padding:0;border:1px solid rgba(28,28,29,.2);border-radius:50%;background:none;color:inherit;text-decoration:none}
.redondo:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.redondo:disabled{opacity:.35;cursor:default;background:none;color:inherit;border-color:rgba(28,28,29,.2)}
.redondo svg.i{width:16px;height:16px}
.bento.resumen{grid-template-columns:minmax(0,1.12fr) minmax(0,1.6fr) minmax(0,1.02fr);grid-template-areas:"cal emb foto" "hist hist info";grid-template-rows:minmax(390px,auto) auto}
.b-cal{grid-area:cal}.b-emb{grid-area:emb}.b-foto{grid-area:foto}.b-hist{grid-area:hist}.b-info{grid-area:info}
/* calendario */
.mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mes b{font:600 16px/1 var(--txt);letter-spacing:-.02em;text-transform:capitalize}
.dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dias small{text-align:center;font-size:11px;color:var(--sub);padding-bottom:4px}
.dia{position:relative;height:42px;padding:0 0 5px 7px;display:flex;align-items:flex-end;border:0;border-radius:11px;background:var(--celda);font:600 11px/1 var(--txt);color:var(--sub);text-align:left}
.dia.vacio{background:none}
.dia.hoy{background:var(--rosa2);color:var(--ink)}
.dia.con{background:var(--ink);color:#fff}
.dia.con.listo{background:#B9B3A6;color:var(--ink)}
.dia.con.hoy{background:var(--rosa2);color:var(--ink)}
.dia.con.tarde{background:var(--mal)}
.dia.elegido{box-shadow:0 0 0 2px var(--carta),0 0 0 4px var(--rosa)}
.dia .caras{position:absolute;top:-5px;right:2px;display:flex}
.cara{width:24px;height:24px;flex:none;display:inline-grid;place-items:center;border-radius:50%;background:var(--ink);color:#fff;font:700 9px/1 var(--txt);letter-spacing:0;box-shadow:0 0 0 2px var(--carta)}
.cara.r{background:var(--rosa2);color:var(--ink)}
.dia .cara{width:20px;height:20px;font-size:8px;margin-left:-6px;background:var(--carta);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
/* embudo de estados */
.embT{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.embT b{display:block;font:700 27px/1 var(--txt);letter-spacing:-.04em}
.embT span{font-size:12px;color:var(--sub)}
.dosB{display:flex;padding:3px;border-radius:99px;background:var(--celda)}
.dosB button{min-height:36px;padding:0 15px;border:0;border-radius:99px;background:none;font-weight:600;font-size:12.5px;color:var(--sub)}
.dosB button[aria-pressed="true"]{background:var(--ink);color:#fff}
.embudo{display:grid;gap:9px;justify-items:center}
.etapa{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px;padding:12px 14px 12px 16px;border:0;border-radius:16px;text-align:left;background:#D3CCBE;transition:translate .2s}
.etapa:hover{translate:0 -2px}
.etapa span{font-size:12.5px;font-weight:600}
.etapa b{display:block;margin-top:2px;font:700 20px/1.1 var(--txt);letter-spacing:-.03em}
.etapa i{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.55)}
.etapa i svg{width:15px;height:15px}
.etapa:nth-child(1){width:100%}
.etapa:nth-child(2){width:88%;background:var(--rosa2)}
.etapa:nth-child(3){width:76%;background:var(--ink);color:#fff}
.etapa:nth-child(3) i{background:var(--rosa2);color:var(--ink)}
/* tarjeta del pedido elegido */
.b-foto{display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;min-height:360px;background:var(--ink) center 20%/cover no-repeat;color:#fff}
.b-foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,22,.42) 0%,rgba(20,20,22,0) 28%,rgba(20,20,22,.1) 45%,rgba(20,20,22,.88) 82%)}
.b-foto.tipo-c::after{background:none}
.b-foto>*{position:relative;z-index:1}
.b-foto .arriba{display:flex;align-items:center;justify-content:space-between;gap:8px}
.b-foto .numero{padding:6px 11px;border-radius:99px;background:rgba(20,20,22,.8);font-weight:700;font-size:12px}
.b-foto .gigante{position:absolute;left:18px;right:18px;top:70px;font:900 clamp(54px,5.4vw,84px)/.82 var(--cond);text-transform:uppercase;color:var(--rosa2)}
.quien{text-align:center}
.quien b{display:block;font:600 22px/1.1 var(--txt);letter-spacing:-.03em}
.quien span{display:block;margin:4px 0 14px;font-size:12.5px;color:rgba(255,255,255,.82)}
.cuads{display:flex;justify-content:center;gap:7px}
.cuad{width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;border-radius:13px;background:#fff;color:var(--ink);text-decoration:none}
.cuad:hover{background:var(--rosa2)}
.cuad.n{background:var(--ink);color:var(--rosa2)}
.b-foto.tipo-c .cuad.n{background:#3A3A3D}
.cuad[aria-disabled="true"]{opacity:.45;pointer-events:none}
/* últimos pedidos */
.tira{display:flex;gap:10px;overflow-x:auto;margin:-8px -18px -18px;padding:14px 18px 22px;scrollbar-width:thin;scrollbar-color:rgba(28,28,29,.25) transparent}
.hoja{width:136px;min-height:226px;flex:none;display:flex;flex-direction:column;padding:13px;border:0;border-radius:16px;background:#D9D3C6;text-align:left;transition:background .2s}
.hoja:hover{background:#CFC8B9}
.hoja small{font-size:11.5px;color:#4A4945}
.hoja b{margin-top:6px;font:600 15px/1.18 var(--txt);letter-spacing:-.02em;overflow-wrap:anywhere}
.hoja .detalle{margin-top:6px;font-size:12px;line-height:1.3;color:#4A4945}
.hoja .monto{display:none}
.hoja .pie{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:10px}
.hoja .punto{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
.hoja .etq{display:none}
.punto.espera{background:#B97A0B}.punto.proceso{background:#2A66C0}.punto.finalizado{background:#2A7548}
.hoja[aria-pressed="true"]{width:292px;background:var(--rosa2);rotate:-1.6deg;border-radius:14px}
.hoja[aria-pressed="true"] :is(small,.detalle){color:#33191F}
.hoja[aria-pressed="true"] b{font-size:19px}
.hoja[aria-pressed="true"] .monto{display:block;margin-top:auto;font:700 34px/1 var(--txt);letter-spacing:-.05em}
.hoja[aria-pressed="true"] .pie{margin-top:0}
.hoja[aria-pressed="true"] .etq{display:inline-flex}
.hoja[aria-pressed="true"] .punto{display:none}
/* información */
.datosL{margin:0}
.lin{display:grid;grid-template-columns:38px minmax(0,1fr) 40px;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--linea)}
.lin:first-child{border-top:0;padding-top:0}
.lin>i{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--celda)}
.lin>i svg{width:16px;height:16px}
.lin dt{font-size:11.5px;color:var(--sub)}
.lin dd{margin:0;font-weight:600;overflow-wrap:anywhere}
/* ---------- listas ---------- */
.bloque{background:var(--carta);border-radius:var(--r);overflow:hidden;margin-bottom:var(--g)}
.bloque h2{margin:0;padding:18px 18px 12px;font:600 17px/1.15 var(--txt);letter-spacing:-.02em}
.vacio{padding:22px 18px;color:var(--sub)}
.filtros{display:flex;align-items:center;gap:8px;margin-bottom:var(--g);flex-wrap:wrap}
.chip{min-height:40px;padding:0 15px;border:0;border-radius:99px;background:var(--carta);font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--papel)}
.chip.quita{background:var(--rosa2)}
.buscar{margin-left:auto;width:min(290px,100%);height:40px;padding:0 16px;border:0;border-radius:99px;background:var(--carta);outline:none;font-size:14px}
.buscar:focus{box-shadow:0 0 0 2px var(--rosa)}
.fila{display:grid;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--linea)}
.fila:first-child{border-top:0}
.fila.click{cursor:pointer}
.fila.click:hover,.fila.click.elegida{background:#EBE6DB}
.titulos{font-size:12px;color:var(--sub)}
.fp{grid-template-columns:44px minmax(140px,1.4fr) 96px 100px 200px 150px}
.fc{grid-template-columns:40px minmax(130px,1.3fr) minmax(0,1.3fr) 64px 100px}
.nombre b{display:block;font:600 15px/1.2 var(--txt);letter-spacing:-.01em;overflow-wrap:anywhere}
.nombre span{display:block;margin-top:2px;font-size:12.5px;color:var(--sub)}
.peq{font-size:12.5px;color:var(--sub);overflow-wrap:anywhere}
.precio{font-weight:700}
.sw{position:relative;width:44px;height:26px;border:0;border-radius:99px;background:#BBB5A9;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{left:21px}
.sw.agot[aria-checked="true"]{background:var(--mal)}
.etq{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.etq::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.etq.espera{background:#FFF0CF;color:#805408}
.etq.proceso{background:#DDE9FA;color:#1F4E96}
.etq.finalizado{background:#D9EFE1;color:#1F6340}
.pago{font-size:11.5px;font-weight:700;color:var(--sub)}.pago.si{color:#1F6340}
.tablero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--g);align-items:start}
.col{background:var(--carta);border-radius:var(--r);padding:16px 12px 12px;min-height:160px}
.col h3{margin:0 6px 14px;font:600 16px/1.2 var(--txt);letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.col h3 span{min-width:30px;padding:5px 9px;border-radius:99px;background:var(--ink);color:#fff;font-size:12px;text-align:center}
.tarjetaP{display:block;width:100%;margin-bottom:8px;padding:13px 14px;border:0;border-radius:16px;background:var(--celda);text-align:left;transition:background .15s}
.tarjetaP:hover{background:#D9D3C6}
.tarjetaP .arr{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tarjetaP .arr>span:first-child{font-size:12px;color:var(--sub)}
.tarjetaP>b{display:block;font:600 15px/1.2 var(--txt);letter-spacing:-.01em;overflow-wrap:anywhere}
.tarjetaP .peq{display:block;margin-top:2px}
.tarjetaP .pie{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap}
.tarjetaP .pie .m{font:700 18px/1.1 var(--txt);letter-spacing:-.03em}
.tarjetaP .pie .m .pago{display:block;margin-top:3px;letter-spacing:0}
/* clientes */
.bento.dosC{grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr)}
.bento.dosC .bloque{margin:0}
.cliT{padding:22px 18px 18px;border-radius:var(--r);background:var(--ink);color:#fff;text-align:center}
.cliT .cara{width:84px;height:84px;font-size:28px;background:var(--rosa2);color:var(--ink);box-shadow:none;margin-bottom:12px}
.cliT>b{display:block;font:600 22px/1.1 var(--txt);letter-spacing:-.03em;overflow-wrap:anywhere}
.cliT>span:not(.cara){display:block;margin:4px 0 16px;font-size:12.5px;color:rgba(255,255,255,.75)}
.cliT .cuad.n{background:#3A3A3D}
/* ilustraciones */
.bento.obras{grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
.obraC{padding:10px 10px 14px}
.obraC .img{position:relative;display:block;width:100%;aspect-ratio:4/4.6;border-radius:15px;background:#cfc9bc center 25%/cover no-repeat;overflow:hidden}
.obraC.apagada .img{filter:grayscale(1) opacity(.55)}
.obraC .sobre{position:absolute;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.obraC .sobre .cuad{pointer-events:auto}
.obraC .sobre div{display:flex;gap:6px}
.banda{padding:6px 11px;border-radius:99px;background:var(--mal);color:#fff;font-weight:700;font-size:12px}
.banda.g{background:var(--ink)}
.obraC .tx{padding:12px 6px 0}
.obraC .l1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.obraC .l1 b{font:600 17px/1.15 var(--txt);letter-spacing:-.02em}
.obraC .l1 span{font-weight:700;white-space:nowrap}

/* comisiones */
.bento.tipos{grid-template-columns:repeat(3,minmax(0,1fr))}
.tipoC{display:flex;flex-direction:column;min-height:400px;padding:20px}
.tipoC .n{display:flex;justify-content:space-between;align-items:flex-start}
.tipoC .n>span:first-child{font-size:12.5px;font-weight:600}
.tipoC h3{margin:26px 0 10px;font:900 44px/.86 var(--cond);text-transform:uppercase}
.tipoC p{margin:0 0 12px;font-size:13.5px}
.tipoC ul{margin:0 0 18px;padding:0;list-style:none;font-size:13px}
.tipoC li{padding:7px 0;border-top:1px solid currentColor;border-color:color-mix(in srgb,currentColor 22%,transparent)}
.tipoC .p{margin-top:auto;font:700 27px/1 var(--txt);letter-spacing:-.04em}
.tipoC .p small{display:block;margin-bottom:4px;font:400 12px/1 var(--txt);letter-spacing:0}
.tipoC.t2{background:var(--rosa2)}

/* ajustes */
.bento.ajustes{grid-template-columns:repeat(2,minmax(0,1fr))}
.bento.ajustes .carta{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:210px;padding:20px}
.bento.ajustes .carta.a1{grid-row:span 2}
.bento.ajustes .carta p{margin:0}
.bento.ajustes .boton{margin-top:auto}
.bento.ajustes h2{margin:0;font:600 17px/1.15 var(--txt);letter-spacing:-.02em}
.bento.ajustes .ic{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:var(--celda)}
.negro{background:var(--ink)!important;color:#fff}
.negro .ic{background:var(--rosa2)!important;color:var(--ink)}
/* ---------- edición ---------- */
.capa{position:fixed;inset:0;background:rgba(20,20,22,.45);z-index:20}
.editor{position:fixed;top:14px;right:14px;bottom:14px;z-index:21;width:min(500px,calc(100% - 28px));background:var(--carta);border-radius:26px;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);display:flex;flex-direction:column}
.editor .top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 22px 12px}

.editor .cuerpo{flex:1;overflow:auto;padding:4px 22px 20px}
.editor .cuerpo .bloque{background:var(--celda);border-radius:16px}
.editor .botones{display:flex;gap:10px;padding:14px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--linea)}
.editor .botones .boton:last-child{flex:1}
.x{width:42px;height:42px;flex:none;border:0;border-radius:50%;background:var(--celda);font-size:16px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.idioma{display:inline-flex;gap:2px;padding:3px;border-radius:99px;background:var(--celda);margin:2px 0 12px}
.idioma button{min-height:36px;padding:0 14px;border:0;border-radius:99px;background:none;font-size:12.5px;font-weight:600;color:var(--sub)}
.idioma button[aria-pressed="true"]{background:var(--ink);color:#fff}
.foto{display:grid;grid-template-columns:140px 1fr;gap:14px;margin-bottom:14px}

.foto .lado{display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--sub)}

.historia li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--rosa2)}

.contacto a{display:inline-flex;align-items:center;min-height:40px;padding:0 15px;border-radius:99px;background:var(--celda);color:inherit;text-decoration:none;font-weight:600;font-size:13px}
.aviso{position:fixed;left:50%;bottom:24px;z-index:40;translate:-50% 0;padding:11px 18px;border-radius:99px;background:var(--ink);color:#fff;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);transition:opacity .25s,translate .25s}
.aviso[hidden]{display:block!important;opacity:0;translate:-50% 20px;pointer-events:none}

@media (max-width:1180px){

  .foto{grid-template-columns:110px 1fr}

}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
/* sin espacios muertos: el embudo y la tira llenan su tarjeta */

<script type="module">
/* ============================================================
   Panel de gestión de Agrio Art.
   Con window.AGRIO_NUBE (url y clave de Supabase) trabaja con la base de datos real;
   sin ella, en modo demostración: guarda en este navegador.
   ============================================================ */
const NUBE = window.AGRIO_NUBE || {}, DEMO = !(NUBE.url && NUBE.clave);
const $ = s => document.querySelector(s), esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pesos = n => n == null || n === "" ? "—" : "$" + Math.round(+n).toLocaleString("es-CO").replace(/,/g, ".");
const fecha = d => d ? new Date(d).toLocaleDateString("es-CO", {day:"numeric", month:"short", year:"numeric"}) : "—";
const fechaHora = d => d ? new Date(d).toLocaleString("es-CO", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "";
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
function avisar(t){ const a = $("#aviso"); a.textContent = t; a.hidden = false; clearTimeout(avisar.t); avisar.t = setTimeout(() => { a.hidden = true; }, 2600); }

/* ---------- estados de los pedidos ---------- */
const ESTADOS = [["espera", "En espera por confirmar"], ["proceso", "En proceso"], ["finalizado", "Finalizado"]];
const est = e => ESTADOS.find(x => x[0] === e) || ESTADOS[0];
const etq = e => `<span class="etq ${est(e)[0]}">${est(e)[1]}</span>`;
const FORMATOS = {dig:"Digital", imp:"Impreso", enm:"Enmarcado"};

/* ---------- datos: base real (Supabase) o demostración (este navegador) ---------- */
const TABLAS = {obras:"id", comision_tipos:"n", clientes:"id", pedidos:"id", pedido_eventos:"id"};
let sb = null;
const LS = "agrio-panel-demo";
function semilla(){
  const ahora = Date.now(), dia = 864e5, c1 = uid(), c2 = uid(), c3 = uid(), p1 = uid(), p2 = uid(), p3 = uid(), p4 = uid();
  const o = (id, orden, nes, nen, des, den, precio, agotada) => ({id, orden, nombre_es:nes, nombre_en:nen, descripcion_es:des, descripcion_en:den, precio, agotada:!!agotada, imagen_url:null, visible:true});
  return {
    obras:[o("tigre", 1, "Tigre", "Tiger", "Un tigre morado con alas de insecto. Es la única obra a color.", "A purple tiger with insect wings. It's the only piece in color.", 400000),
      o("oni", 2, "Máscara oni", "Oni mask", "Un oni entre máscaras, cuentas y tinta roja.", "An oni among masks, beads and red ink.", 420000),
      o("humo", 3, "Humo blanco", "White smoke", "Una mujer de pelo blanco fuma frente a la boca de la bestia.", "A white-haired woman smokes in front of the beast's mouth.", 380000, true),
      o("katana", 4, "Katana", "Katana", "Un pequeño guerrero de capa negra, con su katana y las medias caídas.", "A small warrior in a black cape, with his katana and slouchy socks.", 350000),
      o("espinas", 5, "Espinas", "Thorns", "Entre espinas y flores, con curitas y lágrimas.", "Among thorns and flowers, with band-aids and tears.", 450000)],
    comision_tipos:[
      {n:1, nombre_es:"Primer plano", nombre_en:"Close-up", descripcion_es:"Retrato de cabeza y hombros con fondo sencillo. Ideal para un avatar, un regalo o tu propio monstruo.", descripcion_en:"Head and shoulders portrait with a simple background. Great for an avatar, a gift or your own monster.", punto1_es:"Una persona o personaje", punto1_en:"One person or character", punto2_es:"Fondo plano o con textura", punto2_en:"Plain or textured background", precio:250000, destacado:false},
      {n:2, nombre_es:"Cuerpo entero", nombre_en:"Full body", descripcion_es:"Un personaje completo, de pies a cabeza, con fondo sencillo. La forma más agria de verte dibujado.", descripcion_en:"A complete character, head to toe, with a simple background. The sourest way to get drawn.", punto1_es:"Personaje completo con su pose", punto1_en:"Full character with a pose", punto2_es:"Fondo sencillo y detalles de tu historia", punto2_en:"Simple background and details of your story", precio:420000, destacado:true},
      {n:3, nombre_es:"Mundo agrio", nombre_en:"Sour world", descripcion_es:"Uno o varios personajes dentro de un escenario completo. Una escena con todo su universo.", descripcion_en:"One or more characters inside a full scene. A picture with its whole universe.", punto1_es:"Varios personajes", punto1_en:"Several characters", punto2_es:"Escenario con ambiente y detalle", punto2_en:"Detailed setting and mood", precio:750000, destacado:false}],
    clientes:[{id:c1, nombre:"Cliente de ejemplo 1", correo:"cliente1@ejemplo.com", whatsapp:"", ciudad:"Bogotá", direccion:"", instagram:"", notas:"Dato de ejemplo del modo demostración.", creado:new Date(ahora - 20 * dia).toISOString()},
      {id:c2, nombre:"Cliente de ejemplo 2", correo:"cliente2@ejemplo.com", whatsapp:"", ciudad:"Medellín", direccion:"", instagram:"", notas:"", creado:new Date(ahora - 9 * dia).toISOString()},
      {id:c3, nombre:"Cliente de ejemplo 3", correo:"cliente3@ejemplo.com", whatsapp:"", ciudad:"Cali", direccion:"", instagram:"", notas:"", creado:new Date(ahora - 2 * dia).toISOString()}],
    pedidos:[{id:p1, numero:1, tipo:"comision", estado:"proceso", cliente_id:c1, comision_n:2, formato:"dig", especificaciones:"Ejemplo: personaje con capa y su gato.", monto:420000, pagado:true, pagado_en:new Date(ahora - 10 * dia).toISOString(), fecha_entrega:new Date(ahora + 6 * dia).toISOString().slice(0, 10), notas:"", creado:new Date(ahora - 18 * dia).toISOString()},
      {id:p2, numero:2, tipo:"compra", estado:"proceso", cliente_id:c2, obra_id:"katana", formato:"imp", monto:350000, pagado:true, pagado_en:new Date(ahora - 8 * dia).toISOString(), fecha_entrega:new Date(ahora + 3 * dia).toISOString().slice(0, 10), notas:"", creado:new Date(ahora - 8 * dia).toISOString()},
      {id:p3, numero:3, tipo:"comision", estado:"espera", cliente_id:c3, comision_n:1, formato:"dig", especificaciones:"Ejemplo: retrato para avatar.", monto:250000, pagado:false, notas:"Llegó desde la web (es)", creado:new Date(ahora - 2 * dia).toISOString()},
      {id:p4, numero:4, tipo:"compra", estado:"finalizado", cliente_id:c1, obra_id:"tigre", formato:"enm", monto:400000, pagado:true, pagado_en:new Date(ahora - 30 * dia).toISOString(), notas:"", creado:new Date(ahora - 30 * dia).toISOString()}],
    pedido_eventos:[{id:uid(), pedido_id:p1, estado:"espera", nota:"Solicitud recibida desde la web", creado:new Date(ahora - 18 * dia).toISOString()}, {id:uid(), pedido_id:p1, estado:"proceso", nota:"", creado:new Date(ahora - 10 * dia).toISOString()}],
    v:2
  };
}
const VIEJOS = {nueva:"espera", cotizada:"espera", pendiente:"espera", cancelada:"espera", anticipo:"proceso", boceto:"proceso", pagada:"proceso", enviada:"proceso", entregada:"finalizado"};
function migrar(d){   // datos de una demostración anterior
  d.obras.forEach(o => { if (o.agotada == null) o.agotada = !(+o.copias > 0); delete o.copias; });
  (d.pedidos || []).forEach(p => { p.estado = VIEJOS[p.estado] || p.estado; if (typeof p.pagado !== "boolean") p.pagado = +p.pagado > 0; delete p.anticipo; });
  (d.pedido_eventos || []).forEach(e => { if (e.estado) e.estado = VIEJOS[e.estado] || e.estado; }); delete d.ajustes; d.v = 2;
}
const demo = {
  leer(){ try { const d = JSON.parse(localStorage.getItem(LS)); if (d && d.obras){ if (d.v !== 2){ migrar(d); this.escribir(d); } return d; } } catch(e){} const d = semilla(); this.escribir(d); return d; },
  escribir(d){ try { localStorage.setItem(LS, JSON.stringify(d)); } catch(e){ avisar("No hay espacio en este navegador: usa imágenes más livianas."); throw e; } }
};
const db = {
  async lista(t){
    if (DEMO) return structuredClone(demo.leer()[t] || []);
    const {data, error} = await sb.from(t).select("*"); if (error) throw error; return data;
  },
  async guardar(t, fila){
    const k = TABLAS[t];
    if (DEMO){ const d = demo.leer(), arr = d[t] = d[t] || [];
      if (t === "pedidos" && !fila.numero) fila.numero = arr.reduce((m, x) => Math.max(m, x.numero || 0), 0) + 1;
      if (fila[k] == null || fila[k] === "") fila[k] = t === "comision_tipos" ? arr.length + 1 : uid();
      if (!fila.creado && ["clientes", "pedidos", "pedido_eventos"].includes(t)) fila.creado = new Date().toISOString();
      fila.actualizado = new Date().toISOString();
      const i = arr.findIndex(x => x[k] === fila[k]); if (i >= 0) arr[i] = {...arr[i], ...fila}; else arr.push(fila); demo.escribir(d); return fila; }
    const f = {...fila}; if (f[k] == null || f[k] === "") delete f[k]; if (["obras", "comision_tipos", "pedidos"].includes(t)) f.actualizado = new Date().toISOString();
    const {data, error} = await sb.from(t).upsert(f).select().single(); if (error) throw error; return data;
  },
  async borrar(t, id){
    const k = TABLAS[t];
    if (DEMO){ const d = demo.leer(); d[t] = (d[t] || []).filter(x => x[k] !== id); if (t === "pedidos") d.pedido_eventos = d.pedido_eventos.filter(e => e.pedido_id !== id); demo.escribir(d); return; }
    const {error} = await sb.from(t).delete().eq(k, id); if (error) throw error;
  },

    const fila = {id:id || null, nombre:val(ed, "nombre"), correo:val(ed, "correo").toLowerCase() || null, whatsapp:val(ed, "whatsapp"), ciudad:val(ed, "ciudad"), instagram:val(ed, "instagram"), direccion:val(ed, "direccion"), notas:val(ed, "notas")};
    if (!fila.nombre){ avisar("Escribe el nombre."); return; }
    const g = await db.guardar("clientes", fila); avisar("Cliente guardado");
    if (desdePedido){ editarPedido(desdePedido.pedido, g.id); return; }
    cerrarEditor(); ir(seccion);
  },
  ed => {
    ed.querySelectorAll("[data-pedido]").forEach(f => f.onclick = () => editarPedido(f.dataset.pedido));
    const n = ed.querySelector("[data-nuevo-pedido]"); if (n) n.onclick = () => editarPedido(null, id);
    const b = ed.querySelector("[data-borrar]"); if (b) b.onclick = async () => { if (!confirm("¿Borrar este cliente? Sus pedidos se conservan, sin cliente. No se puede deshacer.")) return; await db.borrar("clientes", id); avisar("Cliente borrado"); cerrarEditor(); ir(seccion); };
  });
}

/* ILUSTRACIONES */
let oFiltro = "todas";
VISTAS.obras = async c => {
  const O = (await db.lista("obras")).sort((a, b) => (a.orden || 0) - (b.orden || 0)); CACHE_O = O;
  const L = O.filter(o => oFiltro === "todas" || (oFiltro === "disp" ? !o.agotada && o.visible !== false : oFiltro === "agot" ? o.agotada : o.visible === false));
  c.innerHTML = cab("Ilustraciones", "Lo que cambies aquí se ve en la galería de la web al guardar.", '<button class="boton" id="nuevaO">+ Subir ilustración</button>') + `
    <div class="filtros">${[["todas", "Todas"], ["disp", "Disponibles"], ["agot", "Agotadas"], ["ocultas", "Ocultas"]].map(([k, n]) => `<button class="chip" data-fo="${k}" aria-pressed="${oFiltro === k}">${n}</button>`).join("")}</div>
    <div class="bento obras">${L.map(o => `<article class="carta obraC ${o.visible === false ? "apagada" : ""}" data-o="${esc(o.id)}"><button class="img" type="button" style="border:0;padding:0;${urlImg(imgDe(o))}" data-editar aria-label="Editar ${esc(o.nombre_es)}"></button>
      <div class="sobre"><span>${o.agotada ? '<span class="banda">Agotada</span>' : ""}${o.visible === false ? ' <span class="banda g">Oculta</span>' : ""}</span><div><button class="cuad" type="button" aria-label="Subir en el orden" title="Subir en el orden" data-mover="-1">${ico("arriba")}</button><button class="cuad" type="button" aria-label="Editar" title="Editar" data-editar>${ico("lapiz")}</button></div></div>
      <div class="tx"><div class="l1"><b>${esc(o.nombre_es)}</b><span>${pesos(o.precio)}</span></div><p>${esc(o.descripcion_es)}</p>
      <div class="estadoObra">Agotada<button class="sw agot" role="switch" aria-checked="${!!o.agotada}" aria-label="Marcar como agotada: ${esc(o.nombre_es)}" data-agotada></button></div>
      <div class="estadoObra">Visible en la web<button class="sw" role="switch" aria-checked="${o.visible !== false}" aria-label="Mostrar en la web: ${esc(o.nombre_es)}" data-visible></button></div></div></article>`).join("") || '<div class="carta">No hay obras con ese filtro.</div>'}</div>`;
  c.querySelectorAll("[data-fo]").forEach(b => b.onclick = () => { oFiltro = b.dataset.fo; ir("obras"); });
  c.querySelector("#nuevaO").onclick = () => editarObra(null);
  c.querySelectorAll("[data-o]").forEach(f => {
    const o = O.find(x => x.id === f.dataset.o);
    f.querySelectorAll("[data-editar]").forEach(b => b.onclick = () => editarObra(o.id));
    f.querySelector("[data-agotada]").onclick = async () => { await db.guardar("obras", {...o, agotada:!o.agotada}); avisar(o.agotada ? o.nombre_es + " vuelve a estar disponible" : o.nombre_es + " quedó agotada"); ir("obras"); };
    f.querySelector("[data-visible]").onclick = async () => { await db.guardar("obras", {...o, visible:o.visible === false}); avisar(o.visible === false ? "Ahora se ve en la web" : "Oculta en la web"); ir("obras"); };
    f.querySelector("[data-mover]").onclick = async () => { const i = O.indexOf(o); if (i <= 0) return; const a = O[i - 1]; await db.guardar("obras", {...o, orden:a.orden}); await db.guardar("obras", {...a, orden:o.orden === a.orden ? (+o.orden || 0) + 1 : o.orden}); ir("obras"); };
  });
};
const imgDe = o => o.imagen_url || "../img/" + o.id + ".jpg";   // las obras de siempre usan la imagen que ya está en la web
async function editarObra(id){
  const O = await db.lista("obras"), o = O.find(x => x.id === id) || {visible:true, agotada:false, precio:0}; let lang = "es", img = id ? imgDe(o) : "";
  abrirEditor(`<div class="top"><h2 id="edT">${id ? "Editar · " + esc(o.nombre_es) : "Nueva ilustración"}</h2><button class="x" aria-label="Cerrar">✕</button></div>
    <div class="cuerpo">
      <div class="foto"><div class="img" id="eImg" style="${img ? urlImg(img) : ""}"></div>
        <div class="lado"><label class="boton linea" style="cursor:pointer">Cambiar imagen<input type="file" accept="image/*" id="eArch" class="oculto"></label><span>JPG o PNG. Se optimiza sola al subirla.</span></div></div>
      <div class="idioma"><button type="button" data-l="es" aria-pressed="true">Español</button><button type="button" data-l="en" aria-pressed="false">English</button></div>
      ${["es", "en"].map(l => `<div data-lang="${l}" ${l === "en" ? "hidden" : ""}>
        <label class="campo"><span>Nombre</span><input class="entrada" name="nombre_${l}" value="${esc(o["nombre_" + l])}"></label>
        <label class="campo"><span>Descripción (máx. 3 líneas en la ficha)</span><textarea class="entrada" name="descripcion_${l}" maxlength="200">${esc(o["descripcion_" + l])}</textarea></label></div>`).join("")}
      <label class="campo"><span>Precio desde (COP)</span><input class="entrada" name="precio" inputmode="numeric" value="${o.precio ?? ""}"></label>
      <div class="dos"><div class="campo"><span>Agotada</span><button type="button" class="sw agot" role="switch" aria-checked="${!!o.agotada}" aria-label="Agotada" id="eAgo"></button></div>
        <div class="campo"><span>Visible en la web</span><button type="button" class="sw" role="switch" aria-checked="${o.visible !== false}" aria-label="Visible en la web" id="eVis"></button></div></div>
    </div>
    <div class="botones">${id ? '<button class="boton peligro" data-borrar>Quitar de la galería</button>' : ""}<button class="boton" data-guardar>Guardar</button></div>`,
  async ed => {
    const nes = val(ed, "nombre_es"); if (!nes){ avisar("Escribe el nombre en español."); return; } if (!img){ avisar("Sube la imagen."); return; }
    const nid = id || nes.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + Date.now().toString(36).slice(-4);
    await db.guardar("obras", {...o, id:nid, orden:o.orden ?? (O.reduce((m, x) => Math.max(m, +x.orden || 0), 0) + 1), nombre_es:nes, nombre_en:val(ed, "nombre_en"), descripcion_es:val(ed, "descripcion_es"), descripcion_en:val(ed, "descripcion_en"),
      precio:num(ed, "precio") || 0, agotada:ed.querySelector("#eAgo").getAttribute("aria-checked") === "true", imagen_url:img === imgDe({id:o.id}) && !o.imagen_url ? null : img, visible:ed.querySelector("#eVis").getAttribute("aria-checked") === "true"});
    avisar("Ilustración guardada"); cerrarEditor(); ir("obras");
  },
  ed => {
    ed.querySelector("#eArch").onchange = async e => { const f = e.target.files[0]; if (!f) return; avisar("Subiendo imagen…");
      try { img = await db.subirImagen(f, id || "obra"); ed.querySelector("#eImg").style.backgroundImage = `url('${img}')`; avisar("Imagen lista: falta guardar"); } catch(er){ avisar("No se pudo subir la imagen: " + er.message); } };
    ed.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { lang = b.dataset.l; ed.querySelectorAll("[data-l]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); ed.querySelectorAll("[data-lang]").forEach(d => { d.hidden = d.dataset.lang !== lang; }); });
    ["#eVis", "#eAgo"].forEach(k => { const v = ed.querySelector(k); v.onclick = () => v.setAttribute("aria-checked", String(v.getAttribute("aria-checked") !== "true")); });
    const b = ed.querySelector("[data-borrar]"); if (b) b.onclick = async () => { if (!confirm(`¿Quitar "${o.nombre_es}" de la galería para siempre? Si solo quieres esconderla, usa "Visible en la web".`)) return; await db.borrar("obras", id); avisar("Ilustración quitada"); cerrarEditor(); ir("obras"); };
  });
}

/* COMISIONES (tipos) */
VISTAS.comisiones = async c => {
  const T = (await db.lista("comision_tipos")).sort((a, b) => a.n - b.n);
  c.innerHTML = cab("Comisiones", "Los tres tipos de encargo que aparecen en la hoja de comisiones de la web.") + `<div class="bento tipos">${T.map((t, i) => `<article class="carta tipoC t${i + 1}"><div class="n"><span>N° 0${t.n}${t.destacado ? " · El más pedido" : ""}</span><button class="redondo" type="button" data-t="${t.n}" aria-label="Editar ${esc(t.nombre_es)}" title="Editar">${ico("lapiz")}</button></div><h3>${esc(t.nombre_es)}</h3><p>${esc(t.descripcion_es)}</p><ul>${[t.punto1_es, t.punto2_es].filter(Boolean).map(x => `<li>${esc(x)}</li>`).join("")}</ul><div class="p"><small>Desde</small>${pesos(t.precio)}</div></article>`).join("")}</div>`;
  c.querySelectorAll("[data-t]").forEach(b => b.onclick = () => editarTipo(+b.dataset.t));
};
async function editarTipo(n){
  const T = await db.lista("comision_tipos"), t = T.find(x => x.n === n); let lang = "es";
  abrirEditor(`<div class="top"><h2 id="edT">${esc(t.nombre_es)}</h2><button class="x" aria-label="Cerrar">✕</button></div>
    <div class="cuerpo">
      <div class="idioma"><button type="button" data-l="es" aria-pressed="true">Español</button><button type="button" data-l="en" aria-pressed="false">English</button></div>
      ${["es", "en"].map(l => `<div data-lang="${l}" ${l === "en" ? "hidden" : ""}>
        <label class="campo"><span>Nombre</span><input class="entrada" name="nombre_${l}" value="${esc(t["nombre_" + l])}"></label>
        <label class="campo"><span>Descripción</span><textarea class="entrada" name="descripcion_${l}" maxlength="180">${esc(t["descripcion_" + l])}</textarea></label>
        <label class="campo"><span>Incluye (1)</span><input class="entrada" name="punto1_${l}" value="${esc(t["punto1_" + l])}"></label>
        <label class="campo"><span>Incluye (2)</span><input class="entrada" name="punto2_${l}" value="${esc(t["punto2_" + l])}"></label></div>`).join("")}
      <label class="campo"><span>Precio desde (COP)</span><input class="entrada" name="precio" inputmode="numeric" value="${t.precio ?? ""}"></label>
      <label class="campo"><span>Marcar como "El más pedido"</span><button type="button" class="sw" role="switch" aria-checked="${!!t.destacado}" id="eDest"></button></label>
    </div>
    <div class="botones"><button class="boton" data-guardar>Guardar</button></div>`,
  async ed => {
    const dest = ed.querySelector("#eDest").getAttribute("aria-checked") === "true", fila = {...t, precio:num(ed, "precio") || 0, destacado:dest};
    ["es", "en"].forEach(l => ["nombre", "descripcion", "punto1", "punto2"].forEach(k => { fila[k + "_" + l] = val(ed, k + "_" + l); }));
    if (dest) for (const o of T) if (o.n !== n && o.destacado) await db.guardar("comision_tipos", {...o, destacado:false});
    await db.guardar("comision_tipos", fila); avisar("Comisión guardada"); cerrarEditor(); ir("comisiones");
  },
  ed => {
    ed.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { lang = b.dataset.l; ed.querySelectorAll("[data-l]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); ed.querySelectorAll("[data-lang]").forEach(d => { d.hidden = d.dataset.lang !== lang; }); });
    const v = ed.querySelector("#eDest"); v.onclick = () => v.setAttribute("aria-checked", String(v.getAttribute("aria-checked") !== "true"));
  });
}

/* AJUSTES */
VISTAS.ajustes = async c => {
  c.innerHTML = cab("Ajustes", "Conexión con la web y respaldo.") + `
    <div class="bento ajustes">
      <section class="carta negro a1"><span class="ic">${ico("nube")}</span><h2>Conexión</h2><p>${DEMO ? "<b>Modo demostración.</b> No hay base de datos conectada: todo se guarda solo en este navegador. Para conectarla, hay que crear el proyecto en Supabase (la guía está en la carpeta del proyecto) y poner su dirección y su clave pública en <i>nube.js</i>." : "<b>Conectado a la base de datos.</b> Los cambios se ven en la web al guardar."}</p></section>
      <section class="carta"><span class="ic">${ico("ojo")}</span><h2>Ver la web</h2><p class="peq">${DEMO ? "Se abre con los cambios de esta demostración." : "Se abre en otra pestaña."}</p><a class="boton linea" href="../${DEMO ? "?vista=panel" : ""}" target="_blank" rel="noopener">Abrir la web</a></section>
      <section class="carta"><span class="ic">${ico("bajar")}</span><h2>Respaldo</h2><p class="peq">Un archivo con todos los pedidos, clientes, obras y comisiones.</p><button class="boton linea" id="aRes">Descargar respaldo</button></section>
      ${DEMO ? `<section class="carta" style="grid-column:1/-1;min-height:0"><h2>Datos de ejemplo</h2><p class="peq">Borra los cambios de la demostración y vuelve al inicio.</p><button class="boton peligro" id="aRst">Volver a los datos de ejemplo</button></section>` : ""}</div>`;
  c.querySelector("#aRes").onclick = async () => { const d = {}; for (const t of Object.keys(TABLAS)) d[t] = await db.lista(t); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], {type:"application/json"})); a.download = `respaldo-agrio-${new Date().toISOString().slice(0, 10)}.json`; a.click(); };
  const r = c.querySelector("#aRst"); if (r) r.onclick = () => { if (!confirm("Se borran los cambios de la demostración y vuelven los datos de ejemplo.")) return; localStorage.removeItem(LS); ir("ajustes"); avisar("Listo"); };
};

/* ---------- arranque ---------- */
(async () => {
  if (!DEMO){ const {createClient} = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm"); sb = createClient(NUBE.url, NUBE.clave);
    const {data} = await sb.auth.getSession(); if (data.session){ try { await comprobarAdmin(data.session.user.email); return; } catch(e){} } }
  else { $("#avisoDemo").hidden = false; const s = sessionStorage.getItem("agrio-panel-demo-sesion"); if (s){ entrar(s); return; } }
  $("#vLogin").hidden = false; pintarLogin();
})();
</script>

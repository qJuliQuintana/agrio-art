<!DOCTYPE html>
<html lang="es" data-tema="noche">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" id="colorTema" content="#0D0D0D">
<!-- Aplica el tema guardado antes de pintar, para que no parpadee. Sin preferencia guardada: noche. -->
<script>try{if(localStorage.getItem("agrio-tema")==="dia")document.documentElement.dataset.tema="dia"}catch(e){}
/* La carga aparece siempre que se abre la página, salvo si el sistema pide reducir el movimiento */
if(!matchMedia("(prefers-reduced-motion: reduce)").matches){document.documentElement.classList.add("cargando");addEventListener("pageshow",e=>{if(e.persisted)location.reload()})}</script>
<meta name="robots" content="noindex"><!-- Prototipo en revisión: quitar esta línea al lanzar para que aparezca en buscadores -->
<title>Agrio Art — Galería de Agrio, artista en Bogotá</title>
<meta name="description" content="Agrio Art: cuadros e ilustración de Agrio, Nicolás González, artista en Bogotá.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Colores registrados para poder animarlos en el cambio de tema */
@property --wall{syntax:"<color>";inherits:true;initial-value:#0D0D0D}
@property --paper{syntax:"<color>";inherits:true;initial-value:#181818}
@property --ink{syntax:"<color>";inherits:true;initial-value:#F1F1EE}
@property --ink-2{syntax:"<color>";inherits:true;initial-value:#A8A8A3}
@property --line{syntax:"<color>";inherits:true;initial-value:#2D2D2D}
@property --inv-bg{syntax:"<color>";inherits:true;initial-value:#F1F1EE}
@property --inv-fg{syntax:"<color>";inherits:true;initial-value:#111111}
@property --inv-2{syntax:"<color>";inherits:true;initial-value:#5C5C58}
@property --tarjeta{syntax:"<color>";inherits:true;initial-value:#171717}
@property --bloque{syntax:"<color>";inherits:true;initial-value:#202020}
:root{
  --wall:#0D0D0D; --paper:#181818; --ink:#F1F1EE; --ink-2:#A8A8A3; --line:#2D2D2D;
  --inv-bg:#F1F1EE; --inv-fg:#111111; --inv-2:#5C5C58;
  --tarjeta:#171717; --tarjeta-fg:#F4F3EE; --stage:#242424; --bloque:#202020;
  --acento:#C8202C; --acento-hover:#A91A25; --on-acento:#FFFFFF;
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pad:12px; --radius:8px; --cap:62px; --cap-compra:76px; --bar:64px; --velo:clamp(96px,17vh,180px);
  color-scheme:dark;
}
[data-tema="dia"]{
  --wall:#E6E5E1; --paper:#FFFFFF; --ink:#131312; --ink-2:#5D5C57; --line:#D3D2CC;
  --inv-bg:#131312; --inv-fg:#FFFFFF; --inv-2:#C9C8C2;
  --tarjeta:#131312; --tarjeta-fg:#F4F3EE; --stage:#E6E5E1; --bloque:#D9D8D2;
  color-scheme:light;
}
@media (max-width:639px){:root{--pad:8px;--radius:6px;--cap:56px}}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{background:var(--wall);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
a{color:inherit}
/* El foco del teclado va en rojo: en blanco se confunde con un borde */
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
svg{display:block;width:100%;height:100%}

/* Barra superior: en celular la primera fila se va con el scroll y los filtros quedan fijos */
.top{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:20px;height:var(--bar);padding:0 var(--pad) 0 calc(var(--pad) + 6px);background:var(--wall)}
.logo{font-weight:800;font-size:27px;letter-spacing:-.04em;line-height:1;text-decoration:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;background:var(--paper);border-radius:6px;font-size:14px;font-weight:500;color:var(--ink);transition:background-color .15s}
.chip:hover{background:var(--line)}
.chip[aria-pressed="true"]{background:var(--inv-bg);color:var(--inv-fg)}
.chip small{font-size:11.5px;font-weight:400;margin-left:5px;color:var(--ink-2)}
.chip[aria-pressed="true"] small{color:var(--inv-2)}
.der{display:flex;align-items:center;gap:8px}
.der .ic{background:var(--paper)}
.der .ic:hover{background:var(--line)}
[data-tema="noche"] .i-luna,[data-tema="dia"] .i-sol{display:none}
.talk{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:6px;background:#fff;color:#111;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;transition:background-color .15s}
.talk:hover{background:#D9D8D2}
.encargo :focus-visible{outline-color:#131312}
@media (max-width:899px){
  :root{--bar:108px}
  .top{top:-58px;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:58px 50px;gap:0 10px;align-items:center}
  .chips{grid-column:1/-1;grid-row:2;margin:0 calc(var(--pad) * -1) 0 -6px;padding:4px var(--pad) 6px 6px}
  .chips{gap:5px}
  .chip{min-height:38px;padding:0 11px;font-size:13.5px}
  .chip small{margin-left:4px}
  .talk{padding:0 14px;font-size:14px}
  .der{gap:6px}
}

/* Tablero */
main{padding:0 var(--pad) var(--pad)}
#board{position:relative;list-style:none;min-height:60vh}
.t{position:absolute;left:0;top:0;border-radius:var(--radius);overflow:hidden;container-type:inline-size;color:var(--ink)}
/* Aparición con el scroll: usa `translate`, independiente del `transform` que ubica la teja en el bento,
   así la card sube hasta su lugar exacto y el acomodo no se altera. */
.t.espera{opacity:0;translate:0 72px}
.t.espera.arriba{translate:0 -72px}
.t.sube{transition:translate 1.1s cubic-bezier(.33,1,.68,1),opacity .85s cubic-bezier(.33,1,.68,1),var(--tv);will-change:translate,opacity}
/* Desenfoque progresivo en el borde inferior: cuatro capas cada vez más intensas hacia abajo */
.velo{position:fixed;left:0;right:0;bottom:0;height:var(--velo);z-index:5;pointer-events:none;opacity:var(--velo-o,1)}
.velo i{position:absolute;inset:0}
.velo i:nth-child(1){-webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px);-webkit-mask-image:linear-gradient(to top,#000 50%,transparent 100%);mask-image:linear-gradient(to top,#000 50%,transparent 100%)}
.velo i:nth-child(2){-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);-webkit-mask-image:linear-gradient(to top,#000 32%,transparent 72%);mask-image:linear-gradient(to top,#000 32%,transparent 72%)}
.velo i:nth-child(3){-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);-webkit-mask-image:linear-gradient(to top,#000 14%,transparent 48%);mask-image:linear-gradient(to top,#000 14%,transparent 48%)}
.velo i:nth-child(4){-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(to top,#000 0%,transparent 26%);mask-image:linear-gradient(to top,#000 0%,transparent 26%)}
.velo::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--wall),transparent 70%);opacity:.72}
@media (prefers-reduced-transparency:reduce){.velo i{display:none}}
.obra{background:var(--paper);outline:1px solid var(--line);outline-offset:-1px}
.ver{display:flex;flex-direction:column;height:100%;text-decoration:none;color:inherit;border-radius:inherit}
.ver:focus-visible{outline-offset:-3px}
.art{position:relative;flex:none;height:var(--art-h);overflow:hidden;background:var(--line)}
.art img{display:block;width:100%;height:100%;object-fit:cover}
.ver:hover .art::after{opacity:1}
.art::after{content:"Ver obra";position:absolute;right:8px;bottom:8px;padding:5px 11px;border-radius:4px;background:#111;color:#fff;font-size:13px;font-weight:500;opacity:0;transition:opacity .15s;pointer-events:none}
@media (hover:none){.art::after{display:none}}
.cap{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0;padding:0 12px;line-height:1.25}
.cap b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap .row{display:flex;justify-content:space-between;gap:8px;margin-top:3px;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cap .kind{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.cap .tec{display:none;margin-top:6px;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roomy .cap .tec{display:block}
@container (max-width:215px){.cap .kind{display:none}.cap{padding:0 10px}.cap b{font-size:14px}.cap .row{font-size:13px}}
.sold .art>svg,.sold .art>img{opacity:.42}
.sold .art{background:var(--paper)}
.stamp{position:absolute;left:8px;top:8px;padding:4px 9px;border-radius:3px;background:var(--acento);color:var(--on-acento);font-size:12.5px;font-weight:600;z-index:1}
.stamp.res{background:var(--paper);color:var(--ink)}
.sold .price{color:var(--ink-2)}

.nota{display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:18px}
.intro{background:var(--tarjeta);color:var(--tarjeta-fg)}
.logo,.intro h1{filter:url(#tinta)}
.intro h1{font-weight:800;font-size:clamp(58px,25cqw,168px);line-height:.82;letter-spacing:-.055em;margin-left:-.03em}
.intro p{font-size:clamp(16px,4.6cqw,20px);line-height:1.3;max-width:46ch}
.intro strong{font-weight:700}
.intro .n{display:block;margin-top:10px;font-size:14px;color:#B9B8B1}
.encargo{background:var(--acento);color:var(--on-acento)}
.encargo h2{font-weight:800;font-size:clamp(23px,12.5cqw,33px);line-height:1;letter-spacing:-.03em}
.encargo p{font-size:15px;line-height:1.3;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:6px;font-weight:600;font-size:16px;text-decoration:none;text-align:center;cursor:pointer}
.btn.ink{background:#131312;color:#fff}
.btn.ink:hover{background:#34332F}
.btn.line{background:var(--line);color:var(--ink);transition:background-color .15s,color .15s}
.btn.line:hover{background:var(--inv-bg);color:var(--inv-fg)}
/* Comprar: botón primario compacto, en la misma fila del precio */
.btn.comprar{position:absolute;right:10px;bottom:10px;min-height:32px;padding:0 12px;border-radius:5px;background:var(--inv-bg);color:var(--inv-fg);font-size:13px;font-weight:600;white-space:nowrap;transition:opacity .15s}
.btn.comprar:hover{opacity:.82}
.compra .cap{justify-content:flex-end;padding-bottom:10px}
.compra .cap .row{order:2;min-height:32px;align-items:center;margin-top:4px;padding-right:80px}
@container (max-width:299px){.compra .cap .kind{display:none}}
@container (max-width:170px){.btn.comprar{right:7px;padding:0 7px;font-size:11.5px}.compra .cap{padding-left:8px;padding-right:7px}.compra .cap .row{padding-right:60px;font-size:12px}}
.encargo .btn{width:100%;padding:0 8px;white-space:nowrap}
.relleno{display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:16px;overflow:hidden}
.relleno p{font-weight:600;font-size:clamp(16px,6.2cqw,26px);line-height:1.12;letter-spacing:-.02em;max-width:24ch}
.relleno a{font-weight:600;font-size:15px;align-self:flex-start;text-underline-offset:3px}
.relleno.r0,.relleno.r2{background:var(--line)}
.relleno.r1{background:var(--tarjeta);color:var(--tarjeta-fg)}
.relleno.r1 a:focus-visible{outline-color:var(--tarjeta-fg)}
.relleno.r3{background:var(--bloque)}
.vacio{padding:60px 20px;text-align:center;color:var(--ink-2)}

@media (prefers-reduced-motion:no-preference){
  .ver{transition:transform .18s cubic-bezier(.2,.8,.3,1)}
  .ver:hover{transform:scale(.985)}
}
footer{margin-top:28px;padding:26px calc(var(--pad) + 6px) 30px;border-top:1px solid var(--line)}
.pie-fila{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px}
.pie-marca{display:block;font-weight:800;font-size:clamp(34px,5vw,56px);line-height:1;letter-spacing:-.045em;text-decoration:none;filter:url(#tinta)}
.pie-lugar{margin-top:6px;font-size:14px;color:var(--ink-2)}
.pie-redes{display:flex;flex-wrap:wrap;gap:4px 18px}
.pie-red{display:inline-flex;align-items:center;gap:7px;min-height:32px;font-weight:500;font-size:13.5px;text-decoration:none}
.pie-red:hover{text-decoration:underline;text-underline-offset:4px}
.pie-red svg{flex:none;width:18px;height:18px}
.pie-base{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;margin-top:22px;font-size:13.5px;color:var(--ink-2)}
.pie-credito{display:inline-flex;align-items:center;gap:9px;color:var(--ink-2);text-decoration:none}
.pie-credito svg{display:block;width:auto;height:30px;color:#EEE9E6}
[data-tema="dia"] .pie-credito svg{color:#17121D}

/* Detalle: panel completo en celular, dos columnas en escritorio */
dialog{border:0;background:var(--paper);color:var(--ink);overflow:visible;margin:auto;width:min(1240px,calc(100vw - 2 * clamp(16px,7vw,110px)));height:min(840px,calc(100dvh - 32px));max-width:none;max-height:none;border-radius:12px}
dialog[open]{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);grid-template-rows:minmax(0,1fr) auto}
dialog[open] .stage{grid-column:1;grid-row:1/-1}
dialog[open] .info{grid-column:2;grid-row:1}
dialog[open] .buy{grid-column:2;grid-row:2}
dialog::backdrop{background:rgba(8,8,7,.62)}
[data-tema="dia"] dialog::backdrop{background:rgba(230,229,225,.66)}
.stage{position:relative;z-index:1;background:var(--stage);padding:32px;min-height:0;border-radius:12px 0 0 12px}
.stage-in{width:100%;height:100%;container-type:size;display:grid;place-items:center}
.frame{width:min(100cqw,calc(100cqh * var(--r)));aspect-ratio:var(--r);overflow:hidden;background:#fff;box-shadow:0 22px 40px -14px rgba(0,0,0,.42)}
.frame.black{outline:7px solid #141312}
.frame.mat{box-shadow:0 0 0 13px #fff,0 0 0 19px #141312,0 30px 44px -10px rgba(0,0,0,.42)}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.info{display:flex;flex-direction:column;min-height:0}
.info-top{display:flex;justify-content:flex-end;gap:6px;padding:12px 12px 0}
.ic{display:grid;place-items:center;width:44px;height:44px;border-radius:6px;background:var(--wall)}
.ic:hover{background:var(--line)}
.ic svg{width:20px;height:20px}
.scroll{flex:1;overflow-y:auto;padding:6px 26px 22px;min-height:0}
.scroll h2{font-weight:800;font-size:clamp(30px,3.4vw,44px);line-height:1;letter-spacing:-.035em}
.sub{margin-top:8px;color:var(--ink-2);font-size:15px}
.desc{margin-top:16px;font-size:17px;line-height:1.45}
.fic{margin-top:18px;border-top:1px solid var(--line)}
.fic div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.35}
.fic dt{color:var(--ink-2)}
.escala{margin-top:18px}
.escala svg{height:124px;width:auto;max-width:100%}
.escala p{margin-top:4px;font-size:13.5px;color:var(--ink-2)}
.buy{flex:none;padding:14px 26px 18px;border-top:1px solid var(--line);background:var(--paper);border-radius:0 0 12px 0}
.price-l{font-weight:800;font-size:27px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.buy .acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}
.buy .acts .solo{grid-column:1/-1}
.btn.acento{background:var(--acento);color:var(--on-acento)}
.btn.acento:hover{background:var(--acento-hover)}
.trust{margin-top:9px;font-size:13px;line-height:1.35;color:var(--ink-2)}
@media (max-width:759px){
  dialog{width:100vw;height:100dvh;border-radius:0}
  dialog[open]{display:flex;flex-direction:column;overflow:hidden}
  dialog[open].vuela,.vuela .wrapm{overflow:visible}
  .info{display:contents}
  .wrapm{flex:1;overflow-y:auto;min-height:0}
  .stage{height:52dvh;padding:70px 30px 30px;border-radius:0}
  .info-top{position:absolute;top:0;right:0;z-index:2}
  .ic{background:var(--paper)}
  .scroll{overflow:visible;padding:18px 16px 20px;flex:none}
  .buy{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-radius:0}
  .buy .acts{margin-top:8px}
  .price-l{font-size:23px}
  .trust{display:none}
  .btn{padding:0 12px;font-size:15px}
}
@media (min-width:760px){.wrapm{display:contents}}
.toast{position:fixed;left:50%;bottom:20px;translate:-50% 0;z-index:30;width:max-content;max-width:calc(100vw - 24px);padding:11px 18px;border-radius:12px;background:var(--inv-bg);color:var(--inv-fg);font-size:14.5px;line-height:1.3;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
/* Cambio de día a noche: un círculo del color nuevo sale del botón y crece por detrás de todo.
   Cada elemento cambia de tono cuando el círculo le pasa por detrás; --d es ese retraso y lo calcula cambiarTema(). */
.logo,.chip,.ic,.t,footer,.velo{
  --tv:--wall .28s linear var(--d,0s),--paper .28s linear var(--d,0s),--ink .28s linear var(--d,0s),--ink-2 .28s linear var(--d,0s),--line .28s linear var(--d,0s),--inv-bg .28s linear var(--d,0s),--inv-fg .28s linear var(--d,0s),--inv-2 .28s linear var(--d,0s),--tarjeta .28s linear var(--d,0s),--bloque .28s linear var(--d,0s);
  transition:var(--tv)
}
.logo,.chip,.ic,footer{color:var(--ink)}
main,footer{position:relative;z-index:1}
.sabana{display:none;position:fixed;z-index:0;border-radius:50%;background:var(--wall);will-change:transform;pointer-events:none}
/* La barra superior es opaca: lleva su propia copia del círculo para que también se vea pasar por detrás de ella */
.sabana-barra{display:none;position:absolute;z-index:-1;border-radius:50%;background:var(--wall);will-change:transform;pointer-events:none}
html.tono .sabana,html.tono .sabana-barra{display:block}
html.tono body{background:var(--wall-vieja)}
html.tono .top{background:var(--wall-vieja);overflow:hidden}
/* Pantalla de carga */
#carga{display:none;position:fixed;inset:0;z-index:100;background:#fff;transition:opacity .45s cubic-bezier(.4,0,.3,1)}
/* Sin canal de scrollbar mientras carga, para que el dibujo cubra todo el ancho */
html.cargando{overflow:hidden;background:#fff;scrollbar-gutter:auto}
html.cargando #carga,#carga.sale{display:block}
#carga.sale{opacity:0;pointer-events:none}
#carga canvas{position:absolute;inset:0;width:100%;height:100%}
.carga-txt{position:absolute;left:50%;bottom:clamp(20px,5vh,44px);translate:-50% 0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 16px 9px;color:#1b1b1e;pointer-events:none}
.carga-txt b{font-weight:800;font-size:clamp(30px,3.4vw,42px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.carga-txt span{font-weight:800;font-size:14px;line-height:1.2;letter-spacing:-.02em;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0"><filter id="tinta" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter></svg>

<div id="carga" role="progressbar" aria-label="Cargando Agrio Art" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <canvas id="cargaLienzo" aria-hidden="true"></canvas>
  <div class="carga-txt" aria-hidden="true"><b id="cargaN">0</b><span>Agrio Art</span></div>
</div>
<script>
/* Carga: la pantalla en blanco se va dibujando a grafito hasta formar un remolino.
   Cada línea es un arco que crece de forma continua sobre su órbita, con suavidad al arrancar y al terminar.
   El tono se deposita sobre el grano del papel: poco grafito solo toca los relieves y mucho los llena.
   Todo se calcula en la tarjeta gráfica en cada cuadro, sin acumular trazos, por eso el avance no da saltos.
   Va aparte del código de la galería para arrancar antes y para que un error allá no deje la pantalla bloqueada. */
(function(){
  const raiz = document.documentElement;
  if (!raiz.classList.contains("cargando")) return;
  const caja = document.getElementById("carga"), lienzo = document.getElementById("cargaLienzo"), num = document.getElementById("cargaN");
  /* 2,5 s de dibujo + 0,05 s en 100 + 0,45 s de salida = 3 s */
  const DUR = 2500, PAUSA = 50;
  const FRAG = `precision highp float;
  uniform vec2 R;uniform float P,E,S,L;
  float h(vec2 p){p=fract(p*vec2(.1031,.1030));p+=dot(p,p.yx+33.33);return fract((p.x+p.y)*p.x);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
  void main(){
    vec2 px=gl_FragCoord.xy/E;
    vec2 q=(px-vec2(R.x*.49,R.y*.53)/E)/S;
    q=mat2(.971,.238,-.238,.971)*q;
    q*=vec2(.9,1.09);
    float keep=1.;
    /* Pasadas superpuestas, como un dibujo real: primero un boceto de líneas finas y después sombreado más ancho */
    for(int i=0;i<8;i++){
      float k=float(i);
      vec2 a=q+(vec2(h(vec2(k,1.7)),h(vec2(k,2.9)))-.5)*.05;
      float r=length(a),th=atan(a.y,a.x)+3.14159;
      vec2 giro=vec2(cos(th),sin(th));
      /* Órbita imperfecta, como una mano: el ruido se muestrea en círculo para que no haya costura */
      float v=r*(1.+(n(giro*1.3+k*5.1)-.5)*.2)+(n(giro*3.1+k*9.3)-.5)*.012;
      float filas=82.-k*7.;
      float c=v*filas,id=floor(c),f=fract(c);
      float rr=id/filas,cerca=1.-smoothstep(.02,.62,rr);
      if(h(vec2(id,k+11.))>mix(.5,.98,cerca))continue;
      /* Cada arco tiene su momento: primero líneas sueltas y al final el centro se va cerrando */
      float d=k*.052+h(vec2(id,k+3.))*.3+cerca*.1*step(2.,k);
      float t=clamp((P-d)/mix(.2,.36,h(vec2(id,k+5.))),0.,1.);
      if(t<=0.)continue;
      t=t*t*(3.-2.*t);
      float largo=mix(1.8,6.1,h(vec2(id,k+7.)));
      float da=mod(th-h(vec2(id,k+9.))*6.283,6.283);
      float frente=largo*t;
      /* El arco crece con la punta suave y se desvanece en ambos extremos */
      float mascara=(1.-smoothstep(frente-.42,frente+.001,da))*smoothstep(0.,.5,da)*(1.-smoothstep(largo-.7,largo,da));
      if(mascara<=0.)continue;
      float perfil=smoothstep(.02,.42,f)*(1.-smoothstep(.58,.98,f));
      float fibra=.58+.62*n(vec2(c*3.4,k*3.)+giro*1.6);
      float presion=mix(.42,.9,cerca)*mix(.72,1.08,h(vec2(id,k+13.)));
      keep*=1.-clamp(perfil*mascara*fibra*presion,0.,.94);
    }
    /* Difuminado: el grafito se frota alrededor del centro a medida que avanza */
    float rc=length(q);
    float frote=smoothstep(.42,1.,P)*(1.-smoothstep(.03,.78,rc))*.56;
    float dep=1.-keep*(1.-frote);
    /* Zona borrada alrededor del número, con el borde que deja un borrador sobre el grafito */
    dep*=smoothstep(.5,1.2,length((px-vec2(R.x*.5/E,L))/vec2(92.,50.)));
    /* Diente del papel */
    float diente=.55*n(px*.62)+.3*n(px*1.45+7.)+.15*n(px*.16+3.);
    float g=max(smoothstep(diente-.38,diente+.12,dep*1.42)*smoothstep(0.,.05,dep),frote*.42);
    g*=mix(.8,1.,dep);
    /* Grafito: gris oscuro con un leve brillo donde se acumula, nunca negro puro */
    vec3 grafito=vec3(.145,.145,.16)-vec3(.05)*smoothstep(.55,1.,dep);
    gl_FragColor=vec4(mix(vec3(1.),grafito,g),1.);
  }`;
  let gl = null, uP;
  try {
    gl = lienzo.getContext("webgl", { alpha: false, antialias: false, powerPreference: "high-performance" });
    if (gl) {
      const sh = (tipo, src) => { const o = gl.createShader(tipo); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
      const pr = gl.createProgram();
      gl.attachShader(pr, sh(gl.VERTEX_SHADER, "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}"));
      gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG));
      gl.bindAttribLocation(pr, 0, "a");
      gl.linkProgram(pr);
      if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error("programa");
      gl.useProgram(pr);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      uP = gl.getUniformLocation(pr, "P");
      const medir = () => {
        const W = innerWidth, H = innerHeight;
        /* Tope de píxeles para mantener el ritmo en pantallas grandes y en celulares */
        const e = Math.min(devicePixelRatio || 1, 2, Math.sqrt(1.5e6 / (W * H)));
        lienzo.width = Math.round(W * e); lienzo.height = Math.round(H * e);
        gl.viewport(0, 0, lienzo.width, lienzo.height);
        gl.uniform2f(gl.getUniformLocation(pr, "R"), lienzo.width, lienzo.height);
        gl.uniform1f(gl.getUniformLocation(pr, "E"), e);
        gl.uniform1f(gl.getUniformLocation(pr, "S"), Math.hypot(W, H) * .62);
        const et = document.querySelector(".carga-txt").getBoundingClientRect();
        gl.uniform1f(gl.getUniformLocation(pr, "L"), H - (et.top + et.height / 2));
      };
      medir();
      addEventListener("resize", medir);
    }
  } catch (e) { gl = null; }
  /* Sin WebGL queda la pantalla en blanco con el contador */
  if (!gl) lienzo.style.display = "none";

  /* El contador no llega a 100 hasta que la página esté lista. Si algo tarda, sigue a los 3 s de más. */
  let lista = false;
  const marcar = () => { lista = true; };
  const fuentes = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  const cargada = new Promise(ok => document.readyState === "complete" ? ok() : addEventListener("load", ok, { once: true }));
  Promise.all([fuentes, cargada]).then(marcar);
  setTimeout(marcar, DUR + 3000);

  let t0 = 0, previo = 0, avance = 0, mostrado = -1;
  function cuadro(ahora){
    if (!t0) { t0 = previo = ahora; }
    const dt = ahora - previo; previo = ahora;
    const x = Math.min(1, (ahora - t0) / DUR), meta = lista ? x : Math.min(x, .92);
    avance = meta === 1 ? 1 : avance + (meta - avance) * (1 - Math.exp(-dt / 50));
    const n = Math.round(avance * 100);
    if (n !== mostrado) { mostrado = n; num.textContent = n; caja.setAttribute("aria-valuenow", n); }
    if (gl) { gl.uniform1f(uP, avance); gl.drawArrays(gl.TRIANGLES, 0, 3); }
    if (avance < 1) requestAnimationFrame(cuadro); else setTimeout(terminar, PAUSA);
  }
  function terminar(){
    caja.classList.add("sale");
    raiz.classList.remove("cargando");
    document.dispatchEvent(new Event("agrio:lista"));
    let hecho = false;
    const quitar = () => {
      if (hecho) return; hecho = true;
      caja.remove();
      if (gl) { const x = gl.getExtension("WEBGL_lose_context"); if (x) x.loseContext(); }
    };
    caja.addEventListener("transitionend", ev => { if (ev.target === caja) quitar(); });
    setTimeout(quitar, 650);
  }
  requestAnimationFrame(cuadro);
})();
</script>

<script>
(function(){
"use strict";

/* Número tomado de la biografía de @agrioink. Falta que Nicolás lo confirme. */
const WHATSAPP = "573028510223";
const waURL = m => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(m)}`;
const waAttrs = m => `href="${waURL(m)}" target="_blank" rel="noopener"`;
document.querySelectorAll("a[data-wa]").forEach(a => { a.href = waURL(a.dataset.wa); a.target = "_blank"; a.rel = "noopener"; });

/* ---------- Ilustraciones de muestra ----------
   Dibujos originales hechos para este prototipo: ocupan el lugar de las fotos reales.
   No reproducen obras de Agrio; solo prueban cómo se ve el tablero con blanco, negro y rojo. */
const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const K = "#0B0B0B", B = "#EDEBE4", G = "#4A4A47", R = "#C8202C";
const svg = (w, h, bg, inner) => `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="${w}" height="${h}" fill="${bg}"/>${inner}</svg>`;
const pol = (cx, cy, r, d) => [cx + r * Math.cos(d * Math.PI / 180), cy + r * Math.sin(d * Math.PI / 180)].map(v => v.toFixed(2)).join(" ");
/* Puntillismo en un solo trazo: muchos puntos con poco costo para el navegador */
const puntos = (a, cx, cy, rx, ry, n, col, sw, borde = true) => {
  let d = "";
  for (let i = 0; i < n; i++) { const t = a() * 6.283, u = borde ? 1 - a() * a() : Math.sqrt(a()); d += `M${(cx + Math.cos(t) * rx * u).toFixed(1)} ${(cy + Math.sin(t) * ry * u).toFixed(1)}h.01`; }
  return `<path d="${d}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" fill="none"/>`;
};
const ojo = (a, cx, cy, r, mira = 0) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${B}" stroke="${K}" stroke-width="${(r * .11).toFixed(2)}"/>${puntos(a, cx, cy, r * .92, r * .92, Math.round(r * 16), K, (r * .035).toFixed(2))}<circle cx="${cx + mira}" cy="${cy}" r="${(r * .52).toFixed(2)}" fill="${K}"/><circle cx="${cx + mira - r * .17}" cy="${cy - r * .2}" r="${(r * .15).toFixed(2)}" fill="${B}"/>`;
const dientes = (x, y, w, n, h, sw = .8, col = B) => {
  let d = `M${x} ${y}`;
  for (let i = 0; i < n; i++) d += ` L${(x + (i + .5) * w / n).toFixed(1)} ${y + h} L${(x + (i + 1) * w / n).toFixed(1)} ${y}`;

/* ---------- Distribución ----------
   Cada obra toma su forma de sus medidas reales: ancho_cm / alto_cm. Nunca se recorta.
   - Muy panorámica: 3 columnas. Horizontal: 2. Gran formato vertical: 2. El resto: 1.
   - El orden lo decide el encaje: entre las siguientes obras se elige la que menos hueco deja.
   - Los huecos pequeños se absorben alargando el pie de la teja de arriba. */
const span = (a, cols) => {
  const r = a.width_cm / a.height_cm;
  if (r >= 2.2) return cols >= 4 ? 3 : cols;
  if (r >= 1.2) return 2;
  if (Math.max(a.width_cm, a.height_cm) >= 130 && cols >= 4) return 2;
  return 1;
};
const INTENTOS = 300, ALTO_MAX_HUECO = 340;
function colsPara(W, gap){
  return Math.max(2, Math.min(7, Math.round((W + gap) / (W < 900 ? 200 : 285))));
}
function calcular(obras, W){
  const css = getComputedStyle(document.documentElement);
  const gap = parseFloat(css.getPropertyValue("--pad")), cap = parseFloat(css.getPropertyValue("--cap")), capCompra = parseFloat(css.getPropertyValue("--cap-compra"));
  const cols = colsPara(W, gap), cw = (W - gap * (cols - 1)) / cols;
  const ancho = s => cw * s + gap * (s - 1);
  const alto = (el, w) => { el.style.width = w + "px"; el.style.height = "auto"; if (!el.isConnected) board.append(el); return el.offsetHeight; };

  /* Se mide una sola vez; después solo se prueban acomodos, sin tocar la página */
  const sI = cols >= 4 ? 2 : cols, sE = cols >= 6 ? 2 : 1;
  const tIntro = { kind: "intro", el: intro, s0: sI, h: Math.max(alto(intro, ancho(sI)), cols >= 4 ? 300 : 0) };
  const tEncargo = { kind: "encargo", el: encargo, s0: Math.min(sE, cols), h: alto(encargo, ancho(sE)) };
  const tObras = obras.map(a => { const s = Math.min(span(a, cols), cols), w = ancho(s), art = w * a.height_cm / a.width_cm, pie = estado(a) === "available" ? capCompra : cap; return { kind: "obra", el: tejas.get(a.slug), a, s0: s, art, h: art + pie }; });

  function intento(lista){
    const y = Array(cols).fill(0), ult = Array(cols).fill(null), out = [], rellenos = [];
    let estirado = 0;
    const colocar = (it, c, s, top) => {
      const p = { ...it, c, s, x: c * (cw + gap), y: top, w: ancho(s), extra: 0 };
      out.push(p);
      for (let i = c; i < c + s; i++) { y[i] = top + p.h + gap; ult[i] = p; }
    };
    /* Devuelve la teja de arriba si puede alargarse sin pisar nada */
    const estirable = c => { const t = ult[c]; if (!t) return null; for (let i = t.c; i < t.c + t.s; i++) if (ult[i] !== t) return null; return t; };
    const estirar = (t, d) => { t.h += d; t.extra += d; estirado += d * t.w; for (let i = t.c; i < t.c + t.s; i++) y[i] += d; };
    const hueco = (c, w, top, h) => { if (h > 6) rellenos.push({ x: c * (cw + gap), y: top, w, h }); };
    const limite = t => Math.max(84, t.h * .2);

    colocar(tIntro, 0, tIntro.s0, 0);
    const pend = lista.slice();
    while (pend.length) {
      let mejor = null;
      pend.slice(0, 6).forEach((it, idx) => {
        for (let c = 0; c + it.s0 <= cols; c++) {
          const top = Math.max(...y.slice(c, c + it.s0));
          let desperdicio = 0, malo = 0;
          for (let i = c; i < c + it.s0; i++) {
            const d = top - y[i]; desperdicio += d;
            if (d > 1) { const t = estirable(i); if (!t || d > limite(t)) malo += 1; }
          }
          const score = top + desperdicio * 1.4 + idx * 14 + malo * 1e5;
          if (!mejor || score < mejor.score) mejor = { score, it, c, top };
        }
      });
      const { it, c, top } = mejor, s = it.s0;
      for (let i = c; i < c + s; i++) {
        const d = top - y[i];
        if (d > 1) {
          const t = estirable(i);
          if (t && d <= limite(t)) estirar(t, d);
          else { hueco(i, cw, y[i], d - gap); y[i] = top; ult[i] = null; }
        }
      }
      pend.splice(pend.indexOf(it), 1);
      colocar(it, c, s, top);
    }

    /* Pie del tablero: si falta poco, alarga la última teja; si falta algo más, pone una tarjeta.
       Si el hueco es muy alto se deja abierto, como el borde irregular de Pinterest. */
    const fondo = Math.max(...y);
    let abierto = 0;
    for (let guard = 0; guard < cols * 3; guard++) {
      const low = Math.min(...y);
      if (fondo - low < 2) break;
      const c0 = y.indexOf(low);
      let c1 = c0; while (c1 + 1 < cols && Math.abs(y[c1 + 1] - low) < 1) c1++;
      const techo = Math.min(fondo, ...[y[c0 - 1], y[c1 + 1]].filter(v => v !== undefined && v > low));
      const d = techo - low, n = c1 - c0 + 1;
      const t = n === 1 ? estirable(c0) : null;
      if (t && t.s === 1 && d <= 72) { estirar(t, d); continue; }
      if (d - gap <= ALTO_MAX_HUECO) hueco(c0, ancho(n), low, d - gap);
      else abierto += d * ancho(n);
      for (let i = c0; i <= c1; i++) { y[i] = techo; ult[i] = null; }
    }
    const vacio = rellenos.reduce((sum, r) => sum + r.w * r.h, 0);
    /* Menos área vacía y menos bloques sueltos es mejor; estirar pesa menos que dejar un hueco */
    const costo = vacio + abierto + estirado * .5 + rellenos.length * cw * 30;
    return { out, rellenos, alto: Math.max(0, fondo - gap), costo };
  }

  /* No hay orden fijo: se prueban acomodos y se queda el que menos espacio pierde.
     La semilla depende de las columnas y las obras, así el tablero no salta entre recargas. */
  const conEncargo = l => { const c = l.slice(); c.splice(Math.min(5, c.length), 0, tEncargo); return c; };
  let mejor = intento(conEncargo(tObras));
  const azar = rng(cols * 97 + obras.length * 31);
  for (let n = 0; n < INTENTOS; n++) {
    const l = tObras.slice();
    for (let i = l.length - 1; i > 0; i--) { const j = Math.floor(azar() * (i + 1)); [l[i], l[j]] = [l[j], l[i]]; }
    const r = intento(conEncargo(l));
    if (r.costo < mejor.costo) mejor = r;
  }
  mejor.out.sort((p, q) => (p.y - q.y) || (p.x - q.x));
  return mejor;
}

/* ---------- Dibujo con transición suave entre filtros ---------- */
const calma = matchMedia("(prefers-reduced-motion: reduce)");
const PISTAS = [
  `<p>Compra sin crear cuenta. Paga con PSE, tarjeta o Nequi.</p>`,
  `<p>¿Tienes dudas sobre una obra?</p><a ${waAttrs("Hola Agrio, tengo una pregunta sobre una de tus obras.")}>Pregúntale a Agrio</a>`

/* ---------- Aparición con el scroll ----------
   Lo que ya se ve al cargar aparece de una vez. Después, cada vez que una card entra a la pantalla
   se anima según la dirección del scroll: sube si bajas por la página y baja si subes por ella.
   Al salir por completo queda lista para animarse de nuevo. La posición en el bento no cambia. */
const pendientes = new Set(), velo = document.getElementById("velo"), barra = document.querySelector(".top");
let scrollPrevio = scrollY, haciaArriba = false;
function programar(el, animar){
  if (calma.matches || el.dataset.visto || pendientes.has(el)) return;
  const y = board.getBoundingClientRect().top + el._y;
  if (!animar && y < innerHeight && y + el._h > 0) { el.dataset.visto = "1"; return; }
  el.classList.add("espera");
  pendientes.add(el);
}
function barrer(){
  if (scrollY !== scrollPrevio) { haciaArriba = scrollY < scrollPrevio; scrollPrevio = scrollY; }
  const top = board.getBoundingClientRect().top, techo = barra.getBoundingClientRect().bottom;
  /* Las que salieron del todo vuelven a quedar listas, sin transición y sin que se note */
  for (const el of board.children) {
    if (!el.dataset.visto) continue;
    const y = top + el._y;
    if (y >= innerHeight || y + el._h <= techo) {
      clearTimeout(el._fin);
      el.classList.remove("sube");
      el.style.transitionDelay = "";
      delete el.dataset.visto;
      el.classList.add("espera");
      pendientes.add(el);
    }
  }
  /* El margen de 24 px evita que una card en el borde se oculte y aparezca una y otra vez */
  const limAbajo = innerHeight - 24, limArriba = techo + 24;
  /* La card que entra se revela primero; las demás la siguen desde ese mismo borde */
  const lote = [...pendientes]
    .filter(el => el.isConnected && top + el._y < limAbajo && top + el._y + el._h > limArriba)
    .sort((a, b) => (haciaArriba ? b._y - a._y : a._y - b._y) || (a._x - b._x));
  let turno = 0;
  lote.forEach(el => {
    pendientes.delete(el);
    el.dataset.visto = "1";
    if (haciaArriba) el.classList.add("arriba");
    void el.offsetWidth; /* Fija el estado inicial para que la transición siempre arranque */
    const retraso = Math.min(turno++ * 80, 320);
    el.style.transitionDelay = retraso + "ms";
    el.classList.add("sube");
    el.classList.remove("espera", "arriba");
    el._fin = setTimeout(() => { el.classList.remove("sube"); el.style.transitionDelay = ""; }, retraso + 1200);
  });
  /* El velo se retira al llegar al final para que las últimas cards queden nítidas */
  const resta = document.documentElement.scrollHeight - (scrollY + innerHeight);
  velo.style.setProperty("--velo-o", Math.max(0, Math.min(1, resta / 120)).toFixed(3));
}
addEventListener("scroll", barrer, { passive: true });
addEventListener("resize", barrer, { passive: true });

function disponer(animar){
  const W = board.clientWidth;
  if (!W) return;
  const fn = FILTROS.find(f => f[0] === filtro)[2];
  visibles = OBRAS.filter(fn);
  const disp = visibles.filter(a => estado(a) === "available").length;
  intro.querySelector("#cuenta").textContent =`${visibles.length} ${visibles.length === 1 ? "obra" : "obras"}, ${disp} ${disp === 1 ? "disponible" : "disponibles"}`;
  document.getElementById("vacio").hidden = visibles.length > 0;

  const antes = new Map();
  if (animar && !calma.matches) board.querySelectorAll(".t").forEach(el => antes.set(el, el.style.transform));
  const foco = document.activeElement;

  const { out, rellenos, alto } = calcular(visibles, W);
  board.querySelectorAll(".relleno").forEach(n => n.remove());
  const vivos = new Set(out.map(p => p.el));
  [...board.children].forEach(n => { if (!vivos.has(n)) n.remove(); });

  out.forEach(p => {
    const el = p.el;
    el.style.width = p.w + "px";
    el.style.height = p.h + "px";
    el.style.transform = `translate(${p.x}px,${p.y}px)`;
    if (p.kind === "obra") {
      el.style.setProperty("--art-h", p.art + "px");
      el.classList.toggle("roomy", p.extra >= 22);
    }
    board.append(el); /* Orden del DOM = orden visual, para teclado y lectores de pantalla */
    el._y = p.y; el._x = p.x; el._h = p.h;
    if (animar && !calma.matches) {
      const de = antes.get(el), a = el.style.transform;
      if (de && de !== a) el.animate([{ transform: de }, { transform: a }], { duration: 380, easing: "cubic-bezier(.2,.8,.2,1)" });
      /* Una obra que vuelve a entrar por un filtro también se anima */
      else if (!de) delete el.dataset.visto;
    }
    programar(el, animar);
  });

  /* Los huecos grandes se vuelven tarjetas útiles; los pequeños, un bloque de color */
  let util = 0;
  rellenos.forEach((r, i) => {
    const d = document.createElement("li");
    const cabe = r.h >= 104 && r.w >= 150 && util < PISTAS.length;
    d.className = `t relleno r${cabe ? util % 2 : (i % 2) + 2}`;
    d.style.cssText = `width:${r.w}px;height:${r.h}px;transform:translate(${r.x}px,${r.y}px)`;
    if (cabe) d.innerHTML = PISTAS[util++];

  pendientes.forEach(el => { if (!el.isConnected) pendientes.delete(el); });
  barrer();
}

const slugActual = () => { const m = location.hash.match(/^#obra\/(.+)$/); return m ? decodeURIComponent(m[1]) : null; };

/* ---------- Abrir una obra: viaja desde su card al centro y aparta las demás hacia los lados ---------- */
const VUELO = 640, CURVA = "cubic-bezier(.22,1,.36,1)";
const dFrame = $("dFrame"), partesDetalle = [$("dBody"), sheet.querySelector(".info-top"), $("dBuy")];
let abierta = null, cerrando = false, apartadas = [], efectos = [];
const artDe = a => { const t = a && tejas.get(a.slug); return t && t.isConnected ? t.querySelector(".art") : null; };
const enVista = r => r.width > 0 && r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth;
const seguir = an => { efectos.push(an); return an; };
function vueloDesde(r0, r1){
  return `translate(${(r0.left + r0.width / 2) - (r1.left + r1.width / 2)}px,${(r0.top + r0.height / 2) - (r1.top + r1.height / 2)}px) scale(${r0.width / r1.width})`;
}
function apartar(duracion){
  /* Todas las cards de un lado se corren lo mismo: así no se pisan entre ellas y conservan sus espacios */
  const panel = sheet.getBoundingClientRect(), medio = panel.left + panel.width / 2, grupos = [];
  const propia = abierta && tejas.get(abierta.slug);
  for (const el of board.children) {
    const r = el.getBoundingClientRect();
    if (r.bottom > 0 && r.top < innerHeight) grupos.push({ el, r, izq: r.left + r.width / 2 < medio });
  }
  const resto = grupos.filter(g => g.el !== propia);
  const dI = Math.max(0, ...resto.filter(g => g.izq).map(g => g.r.right - panel.left + 12));
  const dD = Math.max(0, ...resto.filter(g => !g.izq).map(g => panel.right + 12 - g.r.left));
  apartadas = grupos.map(g => {
    const dx = g.izq ? -dI : dD;
    return { el: g.el, dx, an: g.el.animate([{ translate: "0 0" }, { translate: `${dx}px 0` }], { duration: duracion, easing: CURVA, fill: "forwards" }) };
  });
}
function soltarApartadas(){ apartadas.forEach(x => x.an.cancel()); apartadas = []; }
function esconderTeja(a){
  board.querySelectorAll(".obra").forEach(t => { t.style.visibility = ""; });
  const t = a && tejas.get(a.slug);
  if (t) t.style.visibility = "hidden";
}
function aparecerPartes(){
  partesDetalle.forEach((n, i) => seguir(n.animate(
    [{ opacity: 0, translate: "18px 0" }, { opacity: 1, translate: "0 0" }],
    { duration: 420, delay: 200 + i * 50, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" }
  )));
}
function abrir(a){
  const art = artDe(a), r0 = art && art.getBoundingClientRect();
  raiz.classList.add("lock");
  sheet.showModal();
  if (calma.matches) return;
  efectos.forEach(x => x.cancel()); efectos = [];
  sheet.classList.add("vuela");
  apartar(VUELO);
  const r1 = dFrame.getBoundingClientRect();
  if (r0 && enVista(r0)) {
    esconderTeja(a);
    seguir(dFrame.animate([{ transform: vueloDesde(r0, r1) }, { transform: "none" }], { duration: VUELO, easing: CURVA })).onfinish = () => sheet.classList.remove("vuela");
  } else {
    seguir(dFrame.animate([{ transform: "scale(.88)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: VUELO, easing: CURVA })).onfinish = () => sheet.classList.remove("vuela");
  }
  const color = n => getComputedStyle(n).backgroundColor;
  seguir(sheet.animate({ backgroundColor: ["transparent", color(sheet)] }, { duration: VUELO * .7, easing: "ease-out" }));
  const stage = sheet.querySelector(".stage");
  seguir(stage.animate({ backgroundColor: ["transparent", color(stage)] }, { duration: VUELO * .7, easing: "ease-out" }));
  seguir(sheet.animate({ opacity: [0, 1] }, { duration: VUELO * .7, easing: "ease-out", pseudoElement: "::backdrop" }));
  aparecerPartes();
}
function cambiarObra(a){
  esconderTeja(a);
  if (!calma.matches) {
    seguir(dFrame.animate([{ opacity: 0, transform: "scale(.97)" }, { opacity: 1, transform: "none" }], { duration: 320, easing: "ease-out" }));
    seguir($("dBody").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: "ease-out" }));
  }
}
function salir(){
  if (calma.matches) { terminarCierre(); return; }
  cerrando = true;
  efectos.forEach(x => x.cancel()); efectos = [];
  sheet.classList.add("vuela");
  /* El destino es la posición de la card sin el corrimiento que tiene ahora */
  const art = artDe(abierta), r1 = dFrame.getBoundingClientRect(), RAPIDO = 520;
  const corrida = art && apartadas.find(x => x.el === art.closest(".t"));
  let r0 = art && art.getBoundingClientRect();
  if (r0 && corrida) r0 = { left: r0.left - corrida.dx, top: r0.top, width: r0.width, height: r0.height, right: r0.right - corrida.dx, bottom: r0.bottom };
  const salida = r0 && enVista(r0)
    ? [{ transform: "none" }, { transform: vueloDesde(r0, r1) }]
    : [{ transform: "none", opacity: 1 }, { transform: "scale(.9)", opacity: 0 }];
  apartadas.forEach(x => { x.an.reverse(); x.an.playbackRate = VUELO / RAPIDO * x.an.playbackRate; });
  const color = n => getComputedStyle(n).backgroundColor, stage = sheet.querySelector(".stage");
  seguir(sheet.animate({ backgroundColor: [color(sheet), "transparent"] }, { duration: RAPIDO * .7, easing: "ease-in", fill: "forwards" }));
  seguir(stage.animate({ backgroundColor: [color(stage), "transparent"] }, { duration: RAPIDO * .7, easing: "ease-in", fill: "forwards" }));
  seguir(sheet.animate({ opacity: [1, 0] }, { duration: RAPIDO, easing: "ease-in", fill: "forwards", pseudoElement: "::backdrop" }));
  partesDetalle.forEach(n => seguir(n.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 170, easing: "ease-out", fill: "forwards" })));
  seguir(dFrame.animate(salida, { duration: RAPIDO, easing: CURVA, fill: "forwards" })).onfinish = terminarCierre;
}
function terminarCierre(){
  cerrando = false;
  /* La card vuelve a verse en el mismo cuadro en que se cierra el detalle, sin parpadeo */
  esconderTeja(null);
  soltarApartadas();
  sheet.classList.remove("vuela");
  if (sheet.open) sheet.close();
  efectos.forEach(x => x.cancel()); efectos = [];
  abierta = null;
  alCerrar();
}
addEventListener("resize", () => { if (sheet.open && !cerrando) { soltarApartadas(); apartar(0); } }, { passive: true });

/* ---------- Tema: noche por defecto; la elección de cada visitante se recuerda ---------- */
const botonTema = $("tema"), raiz = document.documentElement;
function aplicarTema(t, guardar){
  raiz.dataset.tema = t;
  botonTema.setAttribute("aria-label", t === "noche" ? "Cambiar a modo día" : "Cambiar a modo noche");
  $("colorTema").content = t === "noche" ? "#0D0D0D" : "#E6E5E1";
  if (guardar) { try { localStorage.setItem("agrio-tema", t); } catch (e) {} }
}
aplicarTema(raiz.dataset.tema, false);
const sabana = $("sabana"), sabanaBarra = $("sabanaBarra"), T_SABANA = 900;
let pasosSabana = [];
const finSabana = () => { pasosSabana = []; raiz.classList.remove("tono"); };
function cambiarTema(sigue){
  if (calma.matches) { aplicarTema(sigue, true); return; }
  if (pasosSabana.length) { pasosSabana.forEach(x => { x.onfinish = null; x.cancel(); }); finSabana(); }
  raiz.style.setProperty("--wall-vieja", getComputedStyle(raiz).getPropertyValue("--wall"));
  /* El círculo nace en el centro del botón y crece hasta cubrir la esquina más lejana */
  const b = botonTema.getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2;
  const R = Math.ceil(Math.max(Math.hypot(cx, cy), Math.hypot(innerWidth - cx, cy), Math.hypot(cx, innerHeight - cy), Math.hypot(innerWidth - cx, innerHeight - cy)));
  [...chips.children, $("tema"), document.querySelector(".logo"), velo, document.querySelector("footer"), ...board.children].forEach(el => {
    const r = el.getBoundingClientRect(), d = Math.hypot(r.left + r.width / 2 - cx, r.top + r.height / 2 - cy);
    el.style.setProperty("--d", Math.round(Math.min(1, d / R) * T_SABANA * .86) + "ms");
  });
  const tb = barra.getBoundingClientRect();
  sabana.style.cssText = `left:${cx - R}px;top:${cy - R}px;width:${R * 2}px;height:${R * 2}px`;
  sabanaBarra.style.cssText = `left:${cx - R - tb.left}px;top:${cy - R - tb.top}px;width:${R * 2}px;height:${R * 2}px`;
  raiz.classList.add("tono");
  aplicarTema(sigue, true);
  const crecer = [{ transform: "scale(0)" }, { transform: "scale(1)" }], tiempo = { duration: T_SABANA, easing: "cubic-bezier(.3,.3,.6,.85)", fill: "both" };
  pasosSabana = [sabana.animate(crecer, tiempo), sabanaBarra.animate(crecer, tiempo)];
  pasosSabana[0].onfinish = finSabana;
}
botonTema.addEventListener("click", () => cambiarTema(raiz.dataset.tema === "noche" ? "dia" : "noche"));

/* Al terminar la carga, las cards a la vista entran con la misma animación del scroll */
if (raiz.classList.contains("cargando")) {
  const fondo = [".top", "main", "footer"].map(s => document.querySelector(s));
  fondo.forEach(n => { n.inert = true; });
  document.addEventListener("agrio:lista", () => {
    fondo.forEach(n => { n.inert = false; });
    [...board.children].forEach(el => { delete el.dataset.visto; programar(el, true); });
    barrer();
    ruta();
  }, { once: true });
}

disponer(false);
ruta();
})();
</script>
